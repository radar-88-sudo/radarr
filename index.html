<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Radar Tracker</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0b0f19;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background: #111827;
            padding: 12px 20px;
            border-bottom: 1px solid #1f2937;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 {
            margin: 0;
            font-size: 1.25rem;
            color: #38bdf8;
            letter-spacing: 0.05em;
        }
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }
        /* Map wrapper with fixed/flex height to prevent collapse */
        .map-wrapper {
            flex: 1;
            position: relative;
            background: #030712;
        }
        #map {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            background: #030712;
        }
        .sidebar {
            width: 350px;
            background: #111827;
            border-left: 1px solid #1f2937;
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }
        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid #1f2937;
            font-weight: bold;
            font-size: 0.95rem;
            color: #94a3b8;
        }
        .flight-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .flight-card {
            background: #1f2937;
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background 0.2s;
            border-left: 4px solid #38bdf8;
        }
        .flight-card:hover {
            background: #374151;
        }
        .flight-callsign {
            font-weight: bold;
            color: #f8fafc;
            font-size: 1rem;
        }
        .flight-details {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <header>
        <h1>LIVE RADAR TRACKER</h1>
        <div id="status" style="font-size: 0.85rem; color: #34d399;">● System Online</div>
    </header>

    <div class="main-container">
        <div class="map-wrapper">
            <div id="map"></div>
        </div>
        <div class="sidebar">
            <div class="sidebar-header">Detected Aircraft</div>
            <div class="flight-list" id="flightList">
                <!-- Flight cards dynamically populated -->
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize Map centered on user location (Bingham, UK area)
        const centerLat = 52.955;
        const centerLon = -0.954;

        const map = L.map('map', {
            zoomControl: false
        }).setView([centerLat, centerLon], 10);

        // Dark theme map tiles
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://carto.com/">CARTO</a>'
        }).addTo(map);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Add Radar Range Circle
        const radarCircle = L.circle([centerLat, centerLon], {
            color: '#38bdf8',
            weight: 1.5,
            opacity: 0.6,
            fillColor: '#38bdf8',
            fillOpacity: 0.03,
            radius: 50000 // 50km
        }).addTo(map);

        // Sample flights data to ensure immediate working display
        const flights = [
            { id: '1', callsign: 'BAW173', aircraft: 'Boeing 777', lat: 53.12, lon: -0.85, altitude: '36,000 ft', speed: '480 kts' },
            { id: '2', callsign: 'RYR4521', aircraft: 'Boeing 737', lat: 52.80, lon: -1.15, altitude: '24,000 ft', speed: '410 kts' },
            { id: '3', callsign: 'EZY829', aircraft: 'Airbus A320', lat: 52.90, lon: -0.65, altitude: '18,500 ft', speed: '350 kts' }
        ];

        const markers = {};
        const listContainer = document.getElementById('flightList');

        function renderFlights() {
            listContainer.innerHTML = '';
            flights.forEach(flight => {
                // Create custom marker icon
                const icon = L.divIcon({
                    className: 'custom-plane-icon',
                    html: `<div style="background: #38bdf8; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 8px #38bdf8;"></div>`,
                    iconSize: [16, 16],
                    iconAnchor: [8, 8]
                });

                const marker = L.marker([flight.lat, flight.lon], { icon }).addTo(map);
                marker.bindPopup(`<b>${flight.callsign}</b><br>${flight.aircraft}<br>Altitude: ${flight.altitude}`);
                markers[flight.id] = marker;

                // Sidebar card
                const card = document.createElement('div');
                card.className = 'flight-card';
                card.innerHTML = `
                    <div class="flight-callsign">${flight.callsign}</div>
                    <div class="flight-details">${flight.aircraft} • Alt: ${flight.altitude}</div>
                `;
                card.addEventListener('click', () => {
                    map.setView([flight.lat, flight.lon], 11);
                    marker.openPopup();
                });
                listContainer.appendChild(card);
            });
        }

        renderFlights();

        // Ensure Leaflet correctly calculates dimensions after load
        setTimeout(() => {
            map.invalidateSize();
        }, 200);

        window.addEventListener('resize', () => {
            map.invalidateSize();
        });
    </script>
</body>
</html>
