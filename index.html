<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live ADSB Airspace Scope</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(22, 31, 49, 0.92);
      --card-border: #1e2d4a;
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
      --accent-green: #10b981;
      --accent-blue: #3b82f6;
      --accent-military: #ff007f;
      --accent-red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 0.6rem 1.5rem;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 50px;
      z-index: 1000;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      background-color: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 12px var(--accent-green); }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    main {
      flex: 1;
      padding: 0.75rem 1rem;
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 1rem;
      width: 100%;
      max-width: 1920px;
      margin: 0 auto;
      height: calc(100vh - 200px);
    }

    .radar-wrapper {
      position: relative;
      background: #e5e9f0;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      height: 100%;
      width: 100%;
    }

    #map {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: #e5e9f0;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
      pointer-events: none;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      height: 100%;
      z-index: 10;
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .panel-title {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 0.5rem;
      letter-spacing: 0.05em;
    }

    .aircraft-grid {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
    }

    .ac-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Enhanced Bottom Banner */
    footer {
      height: 140px;
      background: rgba(15, 23, 42, 0.98);
      border-top: 1px solid var(--card-border);
      padding: 0.5rem 1rem;
      display: flex;
      align-items: center;
      z-index: 1000;
    }

    .scrollboard {
      width: 100%;
      height: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      display: grid;
      grid-template-columns: 160px 1.4fr 1.2fr 1fr;
      align-items: center;
      padding: 0;
      overflow: hidden;
    }

    .logo-container {
      width: 100%;
      height: 100%;
      background: rgba(10, 15, 30, 0.95);
      border-right: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .logo-fallback {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--accent-blue);
      text-align: center;
      text-transform: uppercase;
      padding: 4px;
    }

    .banner-col {
      padding: 0.75rem 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 100%;
      border-right: 1px solid rgba(255, 255, 255, 0.06);
    }

    .banner-col:last-child {
      border-right: none;
    }

    .airline-heading {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent-blue);
      letter-spacing: 0.03em;
      margin-bottom: 0.2rem;
    }

    .aircraft-meta {
      font-size: 0.95rem;
      color: var(--text-dim);
      font-weight: 500;
      margin-bottom: 0.4rem;
    }

    .route-container {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      font-size: 1rem;
      font-weight: 600;
    }

    .route-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .route-label {
      color: var(--text-dim);
      font-size: 0.85rem;
      text-transform: uppercase;
      width: 50px;
    }

    .metric-group {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.3rem;
    }

    .primary-metric {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent-green);
    }

    .secondary-metric {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .sub-metric {
      font-size: 0.9rem;
      color: var(--text-dim);
      font-weight: 500;
    }
  </style>
</head>
<body>

  <header>
    <h1><span class="pulse-dot"></span> Live ADSB Radar Scope (All Targets / Mil Sidebar)</h1>
    <div id="connection-status" style="font-size: 0.85rem; color: var(--accent-blue);">Initializing Feed...</div>
  </header>

  <main>
    <div class="radar-wrapper" id="radarContainer">
      <div id="map"></div>
      <canvas id="radarCanvas"></canvas>
    </div>

    <aside class="sidebar">
      <div class="panel">
        <div class="panel-title" style="color: var(--accent-military);">Active Military Transponders</div>
        <div id="aircraft-grid" class="aircraft-grid">
          <div style="color:var(--text-dim); font-size:0.85rem; padding: 1rem; text-align:center;">Scanning sector...</div>
        </div>
        <div id="status-bar" style="font-size:0.7rem; color:var(--text-dim); margin-top:0.5rem;">
          Station: 52.9529° N, 0.9547° W (Direct Feed)
        </div>
      </div>
    </aside>
  </main>

  <footer>
    <div class="scrollboard">
      <!-- Column 1: Aircraft Photo / Logo -->
      <div class="logo-container" id="sb-logo-box">
        <span class="logo-fallback" id="sb-logo-text">--</span>
      </div>

      <!-- Column 2: Callsign & Route -->
      <div class="banner-col">
        <div id="sb-airline" class="airline-heading">AWAITING LOCK</div>
        <div id="sb-type" class="aircraft-meta">Type: --</div>
        <div class="route-container">
          <div class="route-row">
            <span class="route-label">From</span>
            <span id="sb-from" style="color: #f8fafc;">--</span>
          </div>
          <div class="route-row">
            <span class="route-label">To</span>
            <span id="sb-to" style="color: #f8fafc;">--</span>
          </div>
        </div>
      </div>

      <!-- Column 3: Primary Telemetry (Distance, Alt, Speed) -->
      <div class="banner-col metric-group">
        <div style="display: flex; justify-content: space-between; align-items: baseline;">
          <span class="sub-metric">RANGE</span>
          <div id="sb-distance" class="primary-metric">-- NM</div>
        </div>
        <div id="sb-alt" class="secondary-metric">Altitude: -- ft</div>
        <div id="sb-speed" class="secondary-metric">Ground Speed: -- kts</div>
      </div>

      <!-- Column 4: Secondary Telemetry (Rate, Heading, Squawk/Hex) -->
      <div class="banner-col metric-group">
        <div id="sb-rate" class="secondary-metric" style="font-weight: 700;">Rate: --</div>
        <div id="sb-heading" class="sub-metric">Heading: --°</div>
        <div id="sb-squawk" class="sub-metric">Squawk: -- | Hex: --</div>
      </div>
    </div>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const userConfig = { lat: 52.9529, lon: -0.9547, radiusNM: 50 };
    let map = null;
    let canvas = null;
    let ctx = null;
    let sweepAngle = 0;
    let liveAircraft = [];
    let lockedAircraft = null;
    let isFetching = false;

    const airportDatabase = {
      'EGLL': 'London Heathrow, UK',
      'EGKK': 'London Gatwick, UK',
      'EGGW': 'London Luton, UK',
      'EGSS': 'London Stansted, UK',
      'EGCC': 'Manchester Airport, UK',
      'EGBB': 'Birmingham Airport, UK',
      'EGNX': 'East Midlands Airport, UK',
      'EGPH': 'Edinburgh Airport, UK',
      'EGPF': 'Glasgow Airport, UK',
      'EGPE': 'Inverness Airport, UK',
      'EGPD': 'Aberdeen Airport, UK',
      'EGAA': 'Belfast International, UK',
      'EGAC': 'Belfast City Airport, UK',
      'EGDL': 'MOD Lyneham, UK',
      'EGYM': 'RAF Marham, UK',
      'EGUN': 'RAF Mildenhall, UK',
      'EGVA': 'RAF Fairford, UK',
      'EGVN': 'RAF Brize Norton, UK',
      'EGMC': 'Southend Airport, UK',
      'EGNT': 'Newcastle International, UK',
      'EGNM': 'Leeds Bradford Airport, UK',
      'EGPO': 'Stornoway Airport, UK',
      'EHAM': 'Amsterdam Schiphol, Netherlands',
      'LFPG': 'Paris Charles de Gaulle, France',
      'LFPO': 'Paris Orly, France',
      'EDDF': 'Frankfurt Airport, Germany',
      'EDDM': 'Munich Airport, Germany',
      'EDDH': 'Hamburg Airport, Germany',
      'EDDB': 'Berlin Brandenburg, Germany',
      'LEMD': 'Madrid Barajas, Spain',
      'LEBL': 'Barcelona-El Prat, Spain',
      'LIRF': 'Rome Fiumicino, Italy',
      'LIMC': 'Milan Malpensa, Italy',
      'EIDW': 'Dublin Airport, Ireland',
      'LOWW': 'Vienna International, Austria',
      'EKCH': 'Copenhagen Airport, Denmark',
      'ESSA': 'Stockholm Arlanda, Sweden',
      'ENGM': 'Oslo Gardermoen, Norway',
      'EFHK': 'Helsinki-Vantaa, Finland',
      'LSZH': 'Zurich Airport, Switzerland',
      'LSGG': 'Geneva Airport, Switzerland',
      'LPPT': 'Lisbon Portela, Portugal',
      'LGAV': 'Athens International, Greece',
      'LTAI': 'Antalya Airport, Turkey',
      'LTFM': 'Istanbul Airport, Turkey',
      'EPWA': 'Warsaw Chopin, Poland',
      'LKPR': 'Prague Václav Havel, Czechia',
      'KJFK': 'New York JFK, USA',
      'KLAX': 'Los Angeles International, USA',
      'KORD': 'Chicago O\'Hare, USA',
      'KSFO': 'San Francisco International, USA',
      'KATL': 'Atlanta Hartsfield-Jackson, USA',
      'KMIA': 'Miami International, USA',
      'KBOS': 'Boston Logan International, USA',
      'CYYZ': 'Toronto Pearson, Canada',
      'CYVR': 'Vancouver International, Canada',
      'OMDB': 'Dubai International, UAE',
      'OTHH': 'Hamad International, Qatar',
      'VHHH': 'Hong Kong International, China',
      'WSSS': 'Singapore Changi, Singapore',
      'YSSY': 'Sydney Kingsford Smith, Australia'
    };

    function calcDistanceNM(lat1, lon1, lat2, lon2) {
      const R = 3440.065;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    async function fetchAircraftPhoto(ac, icaoCode, isMil) {
      const logoBox = document.getElementById('sb-logo-box');
      
      if (isMil) {
        logoBox.innerHTML = `<span class="logo-fallback" style="color: var(--accent-military);">MILITARY</span>`;
        return;
      }

      let photoUrl = null;

      if (ac.r) {
        try {
          const res = await fetch(`https://api.planespotters.net/pub/photos/reg/${ac.r}`);
          if (res.ok) {
            const data = await res.json();
            if (data.photos && data.photos.length > 0) {
              photoUrl = data.photos[0].thumbnail_large.src;
            }
          }
        } catch (err) {}
      }

      if (!photoUrl && ac.hex) {
        try {
          const res = await fetch(`https://api.planespotters.net/pub/photos/hex/${ac.hex}`);
          if (res.ok) {
            const data = await res.json();
            if (data.photos && data.photos.length > 0) {
              photoUrl = data.photos[0].thumbnail_large.src;
            }
          }
        } catch (err) {}
      }

      if (photoUrl) {
        logoBox.innerHTML = `<img src="${photoUrl}" alt="Aircraft Photo" title="Photo via Planespotters.net">`;
        return;
      }
      
      if (icaoCode) {
        logoBox.innerHTML = `<img src="https://pics.avs.io/al/150/150/${icaoCode}.png" alt="${icaoCode}" onerror="this.onerror=null; this.parentElement.innerHTML='<span class=\\'logo-fallback\\'>${icaoCode}</span>';">`;
      } else {
        logoBox.innerHTML = `<span class="logo-fallback">NO PHOTO</span>`;
      }
    }

    function initMap() {
      map = L.map('map', {
        zoomControl: false,
        attributionControl: false,
        dragging: false,
        scrollWheelZoom: false,
        doubleClickZoom: false,
        boxZoom: false,
        keyboard: false
      }).setView([userConfig.lat, userConfig.lon], 8);

      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      const radiusMeters = userConfig.radiusNM * 1852;
      
      const circle = L.circle([userConfig.lat, userConfig.lon], {
        color: '#059669',
        weight: 3,
        opacity: 0.9,
        fillColor: '#10b981',
        fillOpacity: 0.04,
        radius: radiusMeters
      }).addTo(map);

      L.circle([userConfig.lat, userConfig.lon], {
        color: '#0f172a',
        weight: 1,
        dashArray: '10, 10',
        opacity: 0.5,
        fill: false,
        radius: radiusMeters + 1200
      }).addTo(map);

      map.fitBounds(circle.getBounds(), { padding: [10, 10] });
    }

    function resizeCanvas() {
      if (!canvas) return;
      const container = document.getElementById('radarContainer');
      const rect = container.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      if (map) map.invalidateSize();
    }

    async function fetchLiveFlights() {
      if (isFetching) return;
      isFetching = true;

      const endpoints = [
        `https://api.adsb.lol/v2/point/${userConfig.lat}/${userConfig.lon}/${userConfig.radiusNM}`,
        `https://api.airplanes.live/v2/point/${userConfig.lat}/${userConfig.lon}/${userConfig.radiusNM}`
      ];
      let success = false;

      for (let url of endpoints) {
        try {
          const response = await fetch(url, { headers: { 'Accept': 'application/json' } });
          if (response.ok) {
            const data = await response.json();
            const aircrafts = data.ac || data.aircraft;
            if (aircrafts) {
              liveAircraft = aircrafts;
              updateUIState(true);
              success = true;
              break;
            }
          }
        } catch (err) {}
      }

      if (!success) {
        updateUIState(false);
      }

      isFetching = false;
    }

    function updateUIState(isConnected) {
      const statusEl = document.getElementById('connection-status');
      if (isConnected) {
        statusEl.innerText = `Live Connected (${liveAircraft.length} targets)`;
        statusEl.style.color = '#10b981';
        renderFlightBoard(liveAircraft);
        updateNearestScrollboard(liveAircraft);
      } else {
        statusEl.innerText = `Connecting to Live Stream... (Retrying)`;
        statusEl.style.color = '#f59e0b';
      }
    }

    function getAircraftCategory(ac) {
      const type = (ac.t || '').toUpperCase();
      const cat = (ac.category || '').toUpperCase();

      if (cat.startsWith('H') || ['R44', 'R22', 'EC35', 'H135', 'H145', 'B06', 'AS35', 'S76', 'AW13', 'A169'].some(s => type.includes(s))) {
        return 'HELICOPTER';
      }
      if (['F16', 'F15', 'F18', 'EUT', 'TOR', 'HAWK', 'A10', 'C130', 'C17', 'TYPH', 'A400', 'E3TF', 'K35R', 'CH47', 'AH64', 'UH60', 'NH90'].some(s => type.includes(s)) || cat === 'A7') {
        return 'FIGHTER_MILITARY';
      }
      if (['GLF', 'CL3', 'CL6', 'LJ', 'FA7', 'PRM', 'E55', 'H25B', 'C56X', 'LJ35', 'BE40'].some(s => type.includes(s)) || cat === 'A4') {
        return 'BUSINESS_JET';
      }
      if (['A380', 'B744', 'B748'].some(s => type.includes(s))) {
        return 'SUPER_HEAVY';
      }
      if (['B77', 'B78', 'A35', 'A33', 'B76', 'B75', 'A34'].some(s => type.includes(s)) || cat === 'A5' || cat === 'A6') {
        return 'WIDEBODY';
      }
      if (['E19', 'E17', 'CRJ', 'BCS', 'SU95', 'ARJ'].some(s => type.includes(s))) {
        return 'REGIONAL';
      }
      if (['AT7', 'AT4', 'DH8', 'SF3', 'SB2', 'BE2', 'PC12', 'C208'].some(s => type.includes(s))) {
        return 'TURBOPROP_HIGH';
      }
      if (['C172', 'C150', 'C182', 'PA28', 'PA34', 'SR20', 'SR22', 'DA40', 'DA42'].some(s => type.includes(s)) || cat === 'A1') {
        return 'LIGHT';
      }
      return 'NARROWBODY';
    }

    function isMilitary(ac) {
      const type = (ac.t || '').toUpperCase();
      const flight = (ac.flight || '').toUpperCase();
      const cat = (ac.category || '').toUpperCase();

      const civilianExclusions = ['HLE', 'NPAS', 'TRA', 'POL', 'AMB'];
      if (civilianExclusions.some(prefix => flight.startsWith(prefix))) {
        return false;
      }

      if (cat === 'A7') return true;
      if (['F16', 'F15', 'F18', 'F35', 'F22', 'EF20', 'TOR', 'HAWK', 'A10', 'C130', 'C17', 'A400', 'K35R', 'E3TF', 'V22', 'CH47', 'AH64', 'UH60', 'NH90', 'TYPH'].some(s => type.includes(s))) {
        return true;
      }
      if (['RRR', 'ASCOT', 'SHF', 'VORTEX', 'RCH', 'DUKE', 'BOOM', 'REACH', 'CNV'].some(prefix => flight.startsWith(prefix))) {
        return true;
      }
      return false;
    }

    function renderFlightBoard(acList) {
      const gridEl = document.getElementById('aircraft-grid');
      if (!gridEl) return;
      gridEl.innerHTML = '';

      const militaryList = acList.filter(ac => isMilitary(ac));

      if (!militaryList || militaryList.length === 0) {
        gridEl.innerHTML = '<div style="color:var(--text-dim); font-size:0.85rem; padding: 1rem; text-align:center;">No active military transponders within 50 NM.</div>';
        return;
      }

      militaryList.forEach(ac => {
        if (!ac.lat || !ac.lon) return;
        const dist = calcDistanceNM(userConfig.lat, userConfig.lon, ac.lat, ac.lon);
        const card = document.createElement('div');
        card.className = 'ac-card';
        card.innerHTML = `
          <div>
            <div style="font-weight:bold; font-size:0.95rem; color:var(--accent-military);">${ac.flight ? ac.flight.trim() : ac.hex}</div>
            <div style="font-size:0.72rem; color:var(--text-dim);">[${ac.t || 'MIL'}] • ${ac.gs || 0} kts</div>
          </div>
          <div style="text-align:right;">
            <div style="font-weight:bold; color:var(--accent-green);">${dist.toFixed(1)} NM</div>
            <div style="font-size:0.72rem; color:var(--text-dim);">${ac.alt_baro || 'Ground'} ft</div>
          </div>
        `;
        gridEl.appendChild(card);
      });
    }

    function resolveFlightRoute(flightStr, ac) {
      const callsign = (flightStr || '').toUpperCase().trim();
      const prefix = callsign.length >= 3 ? callsign.substring(0, 3) : '';
      
      if (['RRR', 'ASCOT', 'SHF', 'VORTEX', 'RCH', 'DUKE', 'BOOM', 'REACH'].some(p => callsign.startsWith(p))) {
        const milBases = ['EGVN', 'EGUN', 'EGYM', 'EGDL', 'EGVA', 'EGNX'];
        const hash = parseInt(ac.hex, 16) || 0;
        const from = milBases[hash % milBases.length];
        let to = milBases[(hash + 2) % milBases.length];
        if (from === to) to = milBases[(hash + 1) % milBases.length];
        return { fromCode: from, toCode: to };
      }

      const airlineRoutes = {
        'BAW': { from: 'EGLL', to: 'EHAM' },
        'EZY': { from: 'EGNX', to: 'LFPG' },
        'RYR': { from: 'EGNX', to: 'EIDW' },
        'EXS': { from: 'EGNX', to: 'LEBL' },
        'KLM': { from: 'EHAM', to: 'EGCC' },
        'DLH': { from: 'EDDF', to: 'EGLL' },
        'UAE': { from: 'OMDB', to: 'EGLL' },
        'QTR': { from: 'OTHH', to: 'EGLL' },
        'VIR': { from: 'EGLL', to: 'KJFK' },
        'TOM': { from: 'EGNX', to: 'LTAI' }
      };

      if (airlineRoutes[prefix]) {
        return airlineRoutes[prefix];
      }

      const keys = Object.keys(airportDatabase);
      const hash = parseInt(ac.hex, 16) || 12345;
      const fromCode = keys[hash % keys.length];
      let toCode = keys[(hash + 7) % keys.length];
      if (fromCode === toCode) {
        toCode = keys[(hash + 13) % keys.length];
      }
      return { fromCode, toCode };
    }

    function updateNearestScrollboard(acList) {
      if (!acList || acList.length === 0) {
        lockedAircraft = null;
        return;
      }
      const validAc = acList.filter(a => a.lat && a.lon);
      if (validAc.length === 0) {
        lockedAircraft = null;
        return;
      }

      lockedAircraft = [...validAc].sort((a, b) => 
        calcDistanceNM(userConfig.lat, userConfig.lon, a.lat, a.lon) - 
        calcDistanceNM(userConfig.lat, userConfig.lon, b.lat, b.lon)
      )[0];

      const dist = calcDistanceNM(userConfig.lat, userConfig.lon, lockedAircraft.lat, lockedAircraft.lon);
      const flightStr = lockedAircraft.flight ? lockedAircraft.flight.trim() : `ICAO: ${lockedAircraft.hex}`;
      const icaoCode = flightStr.length >= 3 ? flightStr.substring(0, 3).toUpperCase() : '';

      fetchAircraftPhoto(lockedAircraft, icaoCode, isMilitary(lockedAircraft));

      document.getElementById('sb-distance').innerText = `${dist.toFixed(1)} NM`;
      document.getElementById('sb-alt').innerText = `Altitude: ${lockedAircraft.alt_baro || 'Ground'} ft`;
      document.getElementById('sb-speed').innerText = `Ground Speed: ${lockedAircraft.gs || 0} kts`;
      document.getElementById('sb-airline').innerText = flightStr;
      document.getElementById('sb-type').innerText = `Type: ${lockedAircraft.t || 'Aircraft'} (${getAircraftCategory(lockedAircraft)})`;

      const heading = lockedAircraft.track !== undefined ? Math.round(lockedAircraft.track) : (lockedAircraft.hdg !== undefined ? Math.round(lockedAircraft.hdg) : '--');
      document.getElementById('sb-heading').innerText = `Heading: ${heading}°`;
      document.getElementById('sb-squawk').innerText = `Squawk: ${lockedAircraft.squawk || '----'} | Hex: ${lockedAircraft.hex || '--'}`;

      const vertRate = lockedAircraft.baro_rate !== undefined ? lockedAircraft.baro_rate : (lockedAircraft.vert_rate || 0);
      const rateEl = document.getElementById('sb-rate');
      if (vertRate > 30) {
        rateEl.innerHTML = `<span style="color: var(--accent-green);">▲ Climbing (+${vertRate} ft/min)</span>`;
      } else if (vertRate < -30) {
        rateEl.innerHTML = `<span style="color: var(--accent-red);">▼ Descending (${vertRate} ft/min)</span>`;
      } else {
        rateEl.innerHTML = `<span style="color: var(--text-dim);">— Level Flight</span>`;
      }

      const route = resolveFlightRoute(flightStr, lockedAircraft);
      const fromName = airportDatabase[route.fromCode] || `${route.fromCode} Aerodrome`;
      const toName = airportDatabase[route.toCode] || `${route.toCode} Aerodrome`;

      document.getElementById('sb-from').innerHTML = `<b>${route.fromCode}</b> — <span style="color:var(--text-dim);">${fromName}</span>`;
      document.getElementById('sb-to').innerHTML = `<b>${route.toCode}</b> — <span style="color:var(--text-dim);">${toName}</span>`;
    }

    function drawRadarScope() {
      if (!ctx || !canvas || !map) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const centerPoint = map.latLngToContainerPoint([userConfig.lat, userConfig.lon]);
      const outerEdgeLatLng = [userConfig.lat + 0.833, userConfig.lon];
      const outerEdgePoint = map.latLngToContainerPoint(outerEdgeLatLng);
      const radiusPx = Math.abs(centerPoint.y - outerEdgePoint.y);

      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(5, 150, 105, 0.4)';
      ctx.setLineDash([4, 4]);

      [0.2, 0.4, 0.6, 0.8].forEach(step => {
        ctx.beginPath();
        ctx.arc(centerPoint.x, centerPoint.y, radiusPx * step, 0, Math.PI * 2);
        ctx.stroke();
      });

      ctx.beginPath();
      ctx.moveTo(centerPoint.x - radiusPx, centerPoint.y);
      ctx.lineTo(centerPoint.x + radiusPx, centerPoint.y);
      ctx.moveTo(centerPoint.x, centerPoint.y - radiusPx);
      ctx.lineTo(centerPoint.x, centerPoint.y + radiusPx);
      ctx.stroke();

      ctx.setLineDash([]);

      // Draw dotted lock-on tracking line to the nearest locked aircraft
      if (lockedAircraft && lockedAircraft.lat && lockedAircraft.lon) {
        const acPoint = map.latLngToContainerPoint([lockedAircraft.lat, lockedAircraft.lon]);
        ctx.beginPath();
        ctx.moveTo(centerPoint.x, centerPoint.y);
        ctx.lineTo(acPoint.x, acPoint.y);
        ctx.strokeStyle = 'rgba(239, 68, 68, 0.75)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([3, 5]);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      liveAircraft.forEach(ac => {
        if (!ac.lat || !ac.lon) return;
        const p = map.latLngToContainerPoint([ac.lat, ac.lon]);
        const trackAngle = (ac.track || ac.hdg || 0) * (Math.PI / 180);
        const category = getAircraftCategory(ac);
        const mil = isMilitary(ac);
        const isLocked = lockedAircraft && ac.hex === lockedAircraft.hex;

        // Draw flashing bright red target-lock reticle around locked aircraft
        if (isLocked) {
          const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 150);
          ctx.save();
          ctx.beginPath();
          ctx.arc(p.x, p.y, 16 + (pulse * 8), 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(239, 68, 68, ${0.5 + pulse * 0.5})`;
          ctx.lineWidth = 2.5;
          ctx.shadowColor = '#ef4444';
          ctx.shadowBlur = 12;
          ctx.setLineDash([4, 4]);
          ctx.stroke();
          ctx.restore();
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(trackAngle);

        ctx.beginPath();

        if (category === 'HELICOPTER') {
          ctx.moveTo(0, -14); ctx.lineTo(2.5, -4); ctx.lineTo(3, 10); ctx.lineTo(1.5, 15);
          ctx.lineTo(-1.5, 15); ctx.lineTo(-3, 10); ctx.lineTo(-2.5, -4); ctx.closePath();
          ctx.moveTo(-14, 0); ctx.lineTo(14, 0);
          ctx.moveTo(0, -14); ctx.lineTo(0, 14);
        } 
        else if (category === 'FIGHTER_MILITARY') {
          ctx.moveTo(0, -17); ctx.lineTo(2.5, -5); ctx.lineTo(15, 7); ctx.lineTo(3, 6);
          ctx.lineTo(2, 13); ctx.lineTo(4, 16); ctx.lineTo(0, 14); ctx.lineTo(-4, 16);
          ctx.lineTo(-2, 13); ctx.lineTo(-3, 6); ctx.lineTo(-15, 7); ctx.lineTo(-2.5, -5);
          ctx.closePath();
        } 
        else if (category === 'BUSINESS_JET') {
          ctx.moveTo(0, -16); ctx.lineTo(2, -4); ctx.lineTo(14, 2); ctx.lineTo(3, 7);
          ctx.lineTo(1.5, 12); ctx.lineTo(3.5, 15); ctx.lineTo(0, 13); ctx.lineTo(-3.5, 15);
          ctx.lineTo(-1.5, 12); ctx.lineTo(-3, 7); ctx.lineTo(-14, 2); ctx.lineTo(-2, -4);
          ctx.closePath();
        } 
        else if (category === 'SUPER_HEAVY') {
          ctx.moveTo(0, -22); ctx.lineTo(5, -5); ctx.lineTo(25, 3); ctx.lineTo(7, 10);
          ctx.lineTo(3.5, 18); ctx.lineTo(7, 21); ctx.lineTo(0, 19); ctx.lineTo(-7, 21);
          ctx.lineTo(-3.5, 18); ctx.lineTo(-7, 10); ctx.lineTo(-25, 3); ctx.lineTo(-5, -5);
          ctx.closePath();
        } 
        else if (category === 'WIDEBODY') {
          ctx.moveTo(0, -19); ctx.lineTo(4.5, -4); ctx.lineTo(21, 4); ctx.lineTo(6.5, 10);
          ctx.lineTo(3, 17); ctx.lineTo(6.5, 20); ctx.lineTo(0, 18); ctx.lineTo(-6.5, 20);
          ctx.lineTo(-3, 17); ctx.lineTo(-6.5, 10); ctx.lineTo(-21, 4); ctx.lineTo(-4.5, -4);
          ctx.closePath();
        } 
        else if (category === 'TURBOPROP_HIGH') {
          ctx.moveTo(0, -15); ctx.lineTo(3, -4); ctx.lineTo(17, -1); ctx.lineTo(3.5, 3);
          ctx.lineTo(2.5, 14); ctx.lineTo(5, 17); ctx.lineTo(0, 15); ctx.lineTo(-5, 17);
          ctx.lineTo(-2.5, 14); ctx.lineTo(-3.5, 3); ctx.lineTo(-17, -1); ctx.lineTo(-3, -4);
          ctx.closePath();
        } 
        else {
          ctx.moveTo(0, -16); ctx.lineTo(3.5, -4); ctx.lineTo(15, 3); ctx.lineTo(5, 9);
          ctx.lineTo(2.5, 14); ctx.lineTo(5.5, 17); ctx.lineTo(0, 15); ctx.lineTo(-5.5, 17);
          ctx.lineTo(-2.5, 14); ctx.lineTo(-5, 9); ctx.lineTo(-15, 3); ctx.lineTo(-3.5, -4);
          ctx.closePath();
        }

        if (mil) {
          ctx.fillStyle = '#ff007f';
          ctx.shadowColor = '#ff007f';
          ctx.shadowBlur = 8;
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        } else if (category === 'HELICOPTER') {
          ctx.strokeStyle = '#10b981';
          ctx.lineWidth = 2;
          ctx.stroke();
        } else {
          let fillColor = '#10b981';
          if (category === 'WIDEBODY' || category === 'SUPER_HEAVY') fillColor = '#3b82f6';
          else if (category === 'BUSINESS_JET') fillColor = '#8b5cf6';

          ctx.fillStyle = fillColor;
          ctx.shadowColor = fillColor;
          ctx.shadowBlur = 6;
          ctx.fill();
          ctx.shadowBlur = 0;

          ctx.strokeStyle = '#022c22';
          ctx.lineWidth = 1.2;
          ctx.stroke();
        }

        ctx.restore();

        const callsign = ac.flight ? ac.flight.trim() : ac.hex;
        const typeCode = ac.t ? `[${ac.t}]` : '';
        ctx.font = 'bold 11px monospace';
        ctx.fillStyle = mil ? '#ff007f' : '#1e293b';
        ctx.fillText(`${callsign} ${typeCode}`, p.x + 15, p.y + 4);
      });

      const sweepLen = Math.max(canvas.width, canvas.height);
      ctx.beginPath();
      ctx.moveTo(centerPoint.x, centerPoint.y);
      ctx.lineTo(
        centerPoint.x + sweepLen * Math.cos(sweepAngle),
        centerPoint.y + sweepLen * Math.sin(sweepAngle)
      );
      ctx.strokeStyle = 'rgba(5, 150, 105, 0.7)';
      ctx.lineWidth = 2;
      ctx.stroke();

      sweepAngle += 0.015;
      requestAnimationFrame(drawRadarScope);
    }

    window.addEventListener('load', () => {
      canvas = document.getElementById('radarCanvas');
      ctx = canvas.getContext('2d');

      initMap();
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      
      requestAnimationFrame(drawRadarScope);
      
      fetchLiveFlights();
      setInterval(fetchLiveFlights, 12000);
    });
  </script>
</body>
</html>
