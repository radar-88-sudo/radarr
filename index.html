<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pi 400 Airspace Scope</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(22, 31, 49, 0.85);
      --card-border: #1e2d4a;
      --text-main: #e2e8f0;
      --text-dim: #94a3b8;
      --accent-green: #10b981;
      --accent-blue: #3b82f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 0.6rem 1.5rem;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 50px;
      z-index: 1000;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      background-color: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 12px var(--accent-green); }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    main {
      flex: 1;
      padding: 0.75rem 1rem;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 1rem;
      width: 100%;
      max-width: 1920px;
      margin: 0 auto;
      height: calc(100vh - 190px);
    }

    .radar-wrapper {
      position: relative;
      background: #090d16;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      height: 100%;
      width: 100%;
    }

    #map {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: #090d16;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
      pointer-events: none;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      height: 100%;
      z-index: 10;
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .panel-title {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 0.5rem;
      letter-spacing: 0.05em;
    }

    .aircraft-grid {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
    }

    .ac-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    footer {
      height: 140px;
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid var(--card-border);
      padding: 0.5rem 1rem;
      display: flex;
      align-items: center;
      z-index: 1000;
    }

    .scrollboard {
      width: 100%;
      height: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      padding: 0.5rem 1rem;
      gap: 1.25rem;
    }

    .info-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.2rem;
    }

    .airline-heading {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent-blue);
    }

    .metrics-section {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      min-width: 180px;
      border-left: 1px solid var(--card-border);
      padding-left: 1rem;
    }

    .distance-badge {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--accent-green);
    }
  </style>
</head>
<body>

  <header>
    <h1><span class="pulse-dot"></span> Pi 400 Airspace Scope (50 NM)</h1>
    <div id="connection-status" style="font-size: 0.85rem; color: var(--text-dim);">Status: Initializing...</div>
  </header>

  <main>
    <div class="radar-wrapper" id="radarContainer">
      <div id="map"></div>
      <canvas id="radarCanvas"></canvas>
    </div>

    <aside class="sidebar">
      <div class="panel">
        <div class="panel-title">Military Flights (50 NM Radius)</div>
        <div id="aircraft-grid" class="aircraft-grid">
          <div style="color: var(--text-dim); font-size: 0.85rem;">Searching airspace...</div>
        </div>
        <div id="status-bar" style="font-size:0.7rem; color:var(--text-dim); margin-top:0.5rem;">
          Station Active
        </div>
      </div>
    </aside>
  </main>

  <footer>
    <div class="scrollboard">
      <div class="info-section">
        <div id="sb-airline" class="airline-heading">Searching Airspace Target...</div>
        <div id="sb-type" style="font-size: 0.85rem; color: var(--text-dim);">Type: --</div>
        <div id="sb-route" style="font-size: 0.85rem; color: var(--text-dim);">Location: Directing scope...</div>
      </div>

      <div class="metrics-section">
        <div id="sb-distance" class="distance-badge">-- NM</div>
        <div id="sb-alt" style="font-size: 0.85rem;">Alt: -- ft</div>
        <div id="sb-speed" style="font-size: 0.85rem;">Speed: -- kts</div>
      </div>
    </div>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const userConfig = { lat: 52.9529, lon: -0.9547, radiusNM: 50 };
    let pollTimer = null;
    let activeAircraft = [];
    let map = null;
    let canvas = null;
    let ctx = null;
    let sweepAngle = 0;

    function calcDistanceNM(lat1, lon1, lat2, lon2) {
      const R = 3440.065;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function isMilitaryAircraft(ac) {
      if (ac.dbFlags !== undefined && (ac.dbFlags & 1) !== 0) return true;
      if (ac.mil === true || ac.mil === 1) return true;
      if (ac.t === 'Military') return true;

      const flight = (ac.flight || '').trim().toUpperCase();
      const hex = (ac.hex || '').trim().toUpperCase();

      const milPrefixes = [
        'RFR', 'RRR', 'CNV', 'NAVY', 'RCH', 'C2', 'ASCOT', 'VIPER', 'HAWK', 
        'Sentry', 'REACH', 'VALKER', 'FORCE', 'JAKE', 'TOPCAT', 'BOEING',
        'AAC', 'GAF', 'FAF', 'IAM', 'BAF', 'AME', 'HRZ', 'CTM', 'CEF'
      ];
      if (milPrefixes.some(p => flight.startsWith(p))) return true;

      const milTypes = ['A400', 'C17', 'C130', 'A332', 'P8', 'KC135', 'E3TF', 'T45', 'F16', 'F35', 'TYPH'];
      if (ac.t && milTypes.some(type => ac.t.toUpperCase().includes(type))) return true;

      if (hex.startsWith('43C') || hex.startsWith('AE') || hex.startsWith('3E8') || hex.startsWith('3FA')) return true;

      return false;
    }

    function initMap() {
      map = L.map('map', {
        zoomControl: false,
        attributionControl: false,
        dragging: false,
        scrollWheelZoom: false,
        doubleClickZoom: false,
        boxZoom: false,
        keyboard: false
      }).setView([userConfig.lat, userConfig.lon], 8);

      // Esri Dark Gray Base Map (Free, no API key required)
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 16
      }).addTo(map);

      const radiusMeters = userConfig.radiusNM * 1852;
      
      L.circle([userConfig.lat, userConfig.lon], {
        color: '#00ff9d',
        weight: 5,
        opacity: 1.0,
        fillColor: '#10b981',
        fillOpacity: 0.08,
        radius: radiusMeters
      }).addTo(map);

      L.circle([userConfig.lat, userConfig.lon], {
        color: '#ffffff',
        weight: 1.5,
        dashArray: '10, 10',
        opacity: 0.8,
        fill: false,
        radius: radiusMeters + 1200
      }).addTo(map);
    }

    function resizeCanvas() {
      if (!canvas) return;
      const container = document.getElementById('radarContainer');
      const rect = container.getBoundingClientRect();
      
      canvas.width = rect.width;
      canvas.height = rect.height;

      if (map) {
        map.invalidateSize();
      }
    }

    // Direct native fetch using lat/lon endpoint with fallback to adsb.fi
    async function fetchADSBData() {
      const lat = userConfig.lat;
      const lon = userConfig.lon;
      
      // Endpoints directly supporting native CORS without query parameters
      const urls = [
        `https://api.adsb.lol/v2/lat/${lat}/lon/${lon}/dist/50`,
        `https://api.adsb.fi/v2/lat/${lat}/lon/${lon}/dist/50`
      ];

      for (const url of urls) {
        try {
          const res = await fetch(url);
          if (res.ok) {
            const data = await res.json();
            if (data && (data.ac || data.aircraft)) {
              return { acList: data.ac || data.aircraft, source: url.includes('lol') ? 'ADSB.lol' : 'ADSB.fi' };
            }
          }
        } catch (e) {
          console.warn(`Fetch failed for ${url}:`, e);
        }
      }

      return null;
    }

    async function pollADSB() {
      if (pollTimer) clearTimeout(pollTimer);
      const statusEl = document.getElementById('connection-status');
      if (statusEl) statusEl.textContent = 'Status: Scanning 50 NM Airspace...';

      const result = await fetchADSBData();

      if (result && result.acList) {
        activeAircraft = result.acList;
        if (statusEl) statusEl.textContent = `Status: Tracking ${activeAircraft.length} Aircraft (${result.source})`;
      } else {
        if (statusEl) statusEl.textContent = 'Status: Retrying Airspace Connection...';
      }

      renderFlightBoard(activeAircraft);
      updateNearestScrollboard(activeAircraft);

      pollTimer = setTimeout(pollADSB, 10000);
    }

    function renderFlightBoard(acList) {
      const gridEl = document.getElementById('aircraft-grid');
      if (!gridEl) return;
      gridEl.innerHTML = '';

      const militaryValid = acList.filter(ac => 
        ac.lat && ac.lon && 
        calcDistanceNM(userConfig.lat, userConfig.lon, ac.lat, ac.lon) <= 50 &&
        isMilitaryAircraft(ac)
      );

      if (militaryValid.length === 0) {
        gridEl.innerHTML = '<div style="color: var(--text-dim); font-size: 0.85rem;">No military flights detected</div>';
        return;
      }

      militaryValid.forEach(ac => {
        const flightName = ac.flight ? ac.flight.trim() : (ac.hex ? ac.hex.toUpperCase() : 'N/A');
        const planeType = ac.t || 'MIL';
        const alt = ac.alt_baro || ac.alt_geom || 0;
        const speed = ac.gs ? `${Math.round(ac.gs)} kts` : 'N/A';
        const dist = calcDistanceNM(userConfig.lat, userConfig.lon, ac.lat, ac.lon);

        const card = document.createElement('div');
        card.className = 'ac-card';
        card.innerHTML = `
          <div>
            <div style="font-weight:bold; font-size:0.95rem; color:#f8fafc;">${flightName}</div>
            <div style="font-size:0.75rem; color:var(--text-dim);">${planeType} • ${speed}</div>
          </div>
          <div style="text-align:right;">
            <div style="font-weight:bold; color:var(--accent-green);">${dist.toFixed(1)} NM</div>
            <div style="font-size:0.75rem; color:var(--text-dim);">${alt} ft</div>
          </div>
        `;
        gridEl.appendChild(card);
      });
    }

    function updateNearestScrollboard(acList) {
      const valid = acList.filter(ac => ac.lat && ac.lon && calcDistanceNM(userConfig.lat, userConfig.lon, ac.lat, ac.lon) <= 50);
      if (valid.length === 0) {
        document.getElementById('sb-airline').innerText = "Searching Airspace Target...";
        document.getElementById('sb-type').innerText = "Type: --";
        document.getElementById('sb-route').innerText = "Location: Directing scope...";
        document.getElementById('sb-distance').innerText = "-- NM";
        document.getElementById('sb-alt').innerText = "Alt: -- ft";
        document.getElementById('sb-speed').innerText = "Speed: -- kts";
        return;
      }

      valid.sort((a, b) => calcDistanceNM(userConfig.lat, userConfig.lon, a.lat, a.lon) - calcDistanceNM(userConfig.lat, userConfig.lon, b.lat, b.lon));

      const nearest = valid[0];
      const dist = calcDistanceNM(userConfig.lat, userConfig.lon, nearest.lat, nearest.lon);
      const callsign = nearest.flight ? nearest.flight.trim() : nearest.hex;

      document.getElementById('sb-distance').innerText = `${dist.toFixed(1)} NM`;
      document.getElementById('sb-alt').innerText = `Alt: ${nearest.alt_baro || 0} ft`;
      document.getElementById('sb-speed').innerText = `Speed: ${Math.round(nearest.gs || 0)} kts`;
      document.getElementById('sb-airline').innerText = callsign;
      document.getElementById('sb-type').innerText = `Type: ${nearest.t || 'N/A'}`;
      document.getElementById('sb-route').innerText = `Target Lat/Lon: ${nearest.lat.toFixed(2)}°, ${nearest.lon.toFixed(2)}°`;
    }

    function drawRadarScope() {
      if (!ctx || !canvas || !map) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const centerPoint = map.latLngToContainerPoint([userConfig.lat, userConfig.lon]);

      const outerEdgeLatLng = [userConfig.lat + 0.833, userConfig.lon];
      const outerEdgePoint = map.latLngToContainerPoint(outerEdgeLatLng);
      const radiusPx = Math.abs(centerPoint.y - outerEdgePoint.y);

      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(16, 185, 129, 0.35)';
      ctx.setLineDash([4, 4]);

      [0.2, 0.4, 0.6, 0.8].forEach(step => {
        ctx.beginPath();
        ctx.arc(centerPoint.x, centerPoint.y, radiusPx * step, 0, Math.PI * 2);
        ctx.stroke();
      });

      ctx.beginPath();
      ctx.moveTo(centerPoint.x - radiusPx, centerPoint.y);
      ctx.lineTo(centerPoint.x + radiusPx, centerPoint.y);
      ctx.moveTo(centerPoint.x, centerPoint.y - radiusPx);
      ctx.lineTo(centerPoint.x, centerPoint.y + radiusPx);
      ctx.stroke();

      ctx.setLineDash([]);

      activeAircraft.forEach(ac => {
        if (!ac.lat || !ac.lon) return;

        const distNM = calcDistanceNM(userConfig.lat, userConfig.lon, ac.lat, ac.lon);
        if (distNM > 50) return;

        const p = map.latLngToContainerPoint([ac.lat, ac.lon]);

        ctx.beginPath();
        ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
        ctx.fillStyle = '#10b981';
        ctx.shadowColor = '#10b981';
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.font = 'bold 11px monospace';
        ctx.fillStyle = '#ffffff';
        const label = ac.flight ? ac.flight.trim() : ac.hex;
        ctx.fillText(label, p.x + 8, p.y + 4);
      });

      const sweepLen = Math.max(canvas.width, canvas.height);
      ctx.beginPath();
      ctx.moveTo(centerPoint.x, centerPoint.y);
      ctx.lineTo(
        centerPoint.x + sweepLen * Math.cos(sweepAngle),
        centerPoint.y + sweepLen * Math.sin(sweepAngle)
      );
      ctx.strokeStyle = 'rgba(16, 185, 129, 0.8)';
      ctx.lineWidth = 2;
      ctx.stroke();

      sweepAngle += 0.015;
      requestAnimationFrame(drawRadarScope);
    }

    window.addEventListener('load', () => {
      canvas = document.getElementById('radarCanvas');
      ctx = canvas.getContext('2d');
      
      document.getElementById('status-bar').innerText = `Station: ${userConfig.lat.toFixed(4)}° N, ${userConfig.lon.toFixed(4)}° W (50 NM)`;

      initMap();
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      
      requestAnimationFrame(drawRadarScope);
      pollADSB();
    });
  </script>
</body>
</html>
