<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live ADSB Airspace Scope</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(22, 31, 49, 0.85);
      --card-border: #1e2d4a;
      --text-main: #e2e8f0;
      --text-dim: #94a3b8;
      --accent-green: #10b981;
      --accent-blue: #3b82f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 0.6rem 1.5rem;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 50px;
      z-index: 1000;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      background-color: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 12px var(--accent-green); }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    main {
      flex: 1;
      padding: 0.75rem 1rem;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 1rem;
      width: 100%;
      max-width: 1920px;
      margin: 0 auto;
      height: calc(100vh - 190px);
    }

    .radar-wrapper {
      position: relative;
      background: #e5e9f0;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      height: 100%;
      width: 100%;
    }

    #map {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: #e5e9f0;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
      pointer-events: none;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      height: 100%;
      z-index: 10;
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .panel-title {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 0.5rem;
      letter-spacing: 0.05em;
    }

    .aircraft-grid {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
    }

    .ac-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    footer {
      height: 140px;
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid var(--card-border);
      padding: 0.5rem 1rem;
      display: flex;
      align-items: center;
      z-index: 1000;
    }

    .scrollboard {
      width: 100%;
      height: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      padding: 0.5rem 1rem;
      gap: 1.25rem;
    }

    .info-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.2rem;
    }

    .airline-heading {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent-blue);
    }

    .metrics-section {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      min-width: 180px;
      border-left: 1px solid var(--card-border);
      padding-left: 1rem;
    }

    .distance-badge {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--accent-green);
    }
  </style>
</head>
<body>

  <header>
    <h1><span class="pulse-dot"></span> Live ADSB Radar Scope (50 NM)</h1>
    <div id="connection-status" style="font-size: 0.85rem; color: var(--accent-blue);">Connecting to Live Feed...</div>
  </header>

  <main>
    <div class="radar-wrapper" id="radarContainer">
      <div id="map"></div>
      <canvas id="radarCanvas"></canvas>
    </div>

    <aside class="sidebar">
      <div class="panel">
        <div class="panel-title">Active Live Transponders</div>
        <div id="aircraft-grid" class="aircraft-grid">
          <div style="color:var(--text-dim); font-size:0.85rem; padding: 1rem; text-align:center;">Scanning live sector...</div>
        </div>
        <div id="status-bar" style="font-size:0.7rem; color:var(--text-dim); margin-top:0.5rem;">
          Station: 52.9529° N, 0.9547° W (Direct Feed)
        </div>
      </div>
    </aside>
  </main>

  <footer>
    <div class="scrollboard">
      <div class="info-section">
        <div id="sb-airline" class="airline-heading">Awaiting Live Lock...</div>
        <div id="sb-type" style="font-size: 0.85rem; color: var(--text-dim);">Type: --</div>
        <div id="sb-route" style="font-size: 0.85rem; color: var(--text-dim);">Location: Synchronizing live packets...</div>
      </div>

      <div class="metrics-section">
        <div id="sb-distance" class="distance-badge">-- NM</div>
        <div id="sb-alt" style="font-size: 0.85rem;">Alt: -- ft</div>
        <div id="sb-speed" style="font-size: 0.85rem;">Speed: -- kts</div>
      </div>
    </div>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const userConfig = { lat: 52.9529, lon: -0.9547, radiusNM: 50 };
    let map = null;
    let canvas = null;
    let ctx = null;
    let sweepAngle = 0;
    let liveAircraft = [];
    let isFetching = false;
    let pollIntervalTimer = null;
    let currentIntervalMs = 15000;

    function calcDistanceNM(lat1, lon1, lat2, lon2) {
      const R = 3440.065;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function initMap() {
      map = L.map('map', {
        zoomControl: false,
        attributionControl: false,
        dragging: false,
        scrollWheelZoom: false,
        doubleClickZoom: false,
        boxZoom: false,
        keyboard: false
      }).setView([userConfig.lat, userConfig.lon], 8);

      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      const radiusMeters = userConfig.radiusNM * 1852;
      
      const circle = L.circle([userConfig.lat, userConfig.lon], {
        color: '#059669',
        weight: 3,
        opacity: 0.9,
        fillColor: '#10b981',
        fillOpacity: 0.04,
        radius: radiusMeters
      }).addTo(map);

      L.circle([userConfig.lat, userConfig.lon], {
        color: '#0f172a',
        weight: 1,
        dashArray: '10, 10',
        opacity: 0.5,
        fill: false,
        radius: radiusMeters + 1200
      }).addTo(map);

      map.fitBounds(circle.getBounds(), { padding: [10, 10] });
    }

    function resizeCanvas() {
      if (!canvas) return;
      const container = document.getElementById('radarContainer');
      const rect = container.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      if (map) map.invalidateSize();
    }

    async function fetchLiveFlights() {
      if (isFetching) return;
      isFetching = true;

      const directUrls = [
        `https://api.adsb.lol/v2/point/${userConfig.lat}/${userConfig.lon}/${userConfig.radiusNM}`,
        `https://api.airplanes.live/v2/point/${userConfig.lat}/${userConfig.lon}/${userConfig.radiusNM}`
      ];

      let success = false;

      for (let url of directUrls) {
        try {
          const response = await fetch(url, { mode: 'cors' });
          if (response.ok) {
            const data = await response.json();
            if (data && data.ac) {
              liveAircraft = data.ac;
              updateUIState(true);
              success = true;
              break;
            }
          }
        } catch (err) {
          try {
            const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(url)}`;
            const proxyResp = await fetch(proxyUrl);
            if (proxyResp.ok) {
              const data = await proxyResp.json();
              if (data && data.ac) {
                liveAircraft = data.ac;
                updateUIState(true);
                success = true;
                break;
              }
            }
          } catch (proxyErr) {
            console.warn('Endpoint & Proxy attempt failed:', proxyErr);
          }
        }
      }

      if (!success) {
        updateUIState(false);
      }

      isFetching = false;
    }

    function updateUIState(isConnected) {
      const statusEl = document.getElementById('connection-status');
      if (isConnected) {
        statusEl.innerText = `Live Connected (${liveAircraft.length} targets)`;
        statusEl.style.color = '#10b981';
        renderFlightBoard(liveAircraft);
        updateNearestScrollboard(liveAircraft);
        currentIntervalMs = 15000;
      } else {
        statusEl.innerText = `Retrying Live Stream...`;
        statusEl.style.color = '#f59e0b';
        currentIntervalMs = Math.min(currentIntervalMs * 1.5, 30000);
      }
      resetPollingInterval();
    }

    function resetPollingInterval() {
      if (pollIntervalTimer) clearInterval(pollIntervalTimer);
      pollIntervalTimer = setInterval(fetchLiveFlights, currentIntervalMs);
    }

    function renderFlightBoard(acList) {
      const gridEl = document.getElementById('aircraft-grid');
      if (!gridEl) return;
      gridEl.innerHTML = '';

      if (!acList || acList.length === 0) {
        gridEl.innerHTML = '<div style="color:var(--text-dim); font-size:0.85rem; padding: 1rem; text-align:center;">No active transponders within 50 NM.</div>';
        return;
      }

      acList.forEach(ac => {
        if (!ac.lat || !ac.lon) return;
        const dist = calcDistanceNM(userConfig.lat, userConfig.lon, ac.lat, ac.lon);
        const card = document.createElement('div');
        card.className = 'ac-card';
        card.innerHTML = `
          <div>
            <div style="font-weight:bold; font-size:0.95rem; color:#f8fafc;">${ac.flight ? ac.flight.trim() : ac.hex}</div>
            <div style="font-size:0.75rem; color:var(--text-dim);">${ac.t || 'Unknown'} • ${ac.gs || 0} kts</div>
          </div>
          <div style="text-align:right;">
            <div style="font-weight:bold; color:var(--accent-green);">${dist.toFixed(1)} NM</div>
            <div style="font-size:0.75rem; color:var(--text-dim);">${ac.alt_baro || 'Ground'} ft</div>
          </div>
        `;
        gridEl.appendChild(card);
      });
    }

    function updateNearestScrollboard(acList) {
      if (!acList || acList.length === 0) return;
      const validAc = acList.filter(a => a.lat && a.lon);
      if (validAc.length === 0) return;

      let nearest = [...validAc].sort((a, b) => 
        calcDistanceNM(userConfig.lat, userConfig.lon, a.lat, a.lon) - 
        calcDistanceNM(userConfig.lat, userConfig.lon, b.lat, b.lon)
      )[0];

      const dist = calcDistanceNM(userConfig.lat, userConfig.lon, nearest.lat, nearest.lon);
      document.getElementById('sb-distance').innerText = `${dist.toFixed(1)} NM`;
      document.getElementById('sb-alt').innerText = `Alt: ${nearest.alt_baro || 'Ground'} ft`;
      document.getElementById('sb-speed').innerText = `Speed: ${nearest.gs || 0} kts`;
      document.getElementById('sb-airline').innerText = nearest.flight ? nearest.flight.trim() : `ICAO: ${nearest.hex}`;
      document.getElementById('sb-type').innerText = `Type: ${nearest.t || 'Aircraft'} (Live ADSB)`;
      document.getElementById('sb-route').innerText = `Position: ${nearest.lat.toFixed(3)}°, ${nearest.lon.toFixed(3)}°`;
    }

    function getAircraftCategory(ac) {
      const type = (ac.t || '').toUpperCase();
      const cat = (ac.category || '').toUpperCase();

      if (cat.startsWith('H') || ['R44', 'R22', 'EC35', 'H135', 'H145', 'B06', 'AS35', 'S76', 'AW13'].some(s => type.includes(s))) {
        return 'HELICOPTER';
      }
      if (['A380', 'B744', 'B748'].some(s => type.includes(s))) {
        return 'SUPER_HEAVY';
      }
      if (['B77', 'B78', 'A35', 'A33', 'B76', 'B75', 'A34'].some(s => type.includes(s)) || cat === 'A5' || cat === 'A6') {
        return 'WIDEBODY';
      }
      if (['E19', 'E17', 'CRJ', 'BCS', 'SU95', 'ARJ'].some(s => type.includes(s))) {
        return 'REGIONAL';
      }
      if (['AT7', 'AT4', 'DH8', 'SF3', 'SB2', 'BE2', 'PC12', 'C208'].some(s => type.includes(s))) {
        return 'TURBOPROP';
      }
      if (['C172', 'C150', 'C182', 'PA28', 'PA34', 'SR20', 'SR22', 'DA40', 'DA42'].some(s => type.includes(s)) || cat === 'A1') {
        return 'LIGHT';
      }
      return 'NARROWBODY'; // Standard Narrowbody Jet (A320, B737 family)
    }

    function drawRadarScope() {
      if (!ctx || !canvas || !map) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const centerPoint = map.latLngToContainerPoint([userConfig.lat, userConfig.lon]);
      const outerEdgeLatLng = [userConfig.lat + 0.833, userConfig.lon];
      const outerEdgePoint = map.latLngToContainerPoint(outerEdgeLatLng);
      const radiusPx = Math.abs(centerPoint.y - outerEdgePoint.y);

      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(5, 150, 105, 0.4)';
      ctx.setLineDash([4, 4]);

      [0.2, 0.4, 0.6, 0.8].forEach(step => {
        ctx.beginPath();
        ctx.arc(centerPoint.x, centerPoint.y, radiusPx * step, 0, Math.PI * 2);
        ctx.stroke();
      });

      ctx.beginPath();
      ctx.moveTo(centerPoint.x - radiusPx, centerPoint.y);
      ctx.lineTo(centerPoint.x + radiusPx, centerPoint.y);
      ctx.moveTo(centerPoint.x, centerPoint.y - radiusPx);
      ctx.lineTo(centerPoint.x, centerPoint.y + radiusPx);
      ctx.stroke();

      ctx.setLineDash([]);

      // Draw unique aircraft silhouette shapes based on specific type matching
      liveAircraft.forEach(ac => {
        if (!ac.lat || !ac.lon) return;
        const p = map.latLngToContainerPoint([ac.lat, ac.lon]);
        const trackAngle = (ac.track || ac.hdg || 0) * (Math.PI / 180);
        const category = getAircraftCategory(ac);

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(trackAngle);

        ctx.beginPath();

        if (category === 'HELICOPTER') {
          // Helicopter rotor / body silhouette
          ctx.arc(0, 0, 4, 0, Math.PI * 2);
          ctx.moveTo(0, 4); ctx.lineTo(0, 14);
          ctx.moveTo(-12, 0); ctx.lineTo(12, 0);
          ctx.moveTo(0, -12); ctx.lineTo(0, 12);
        } else if (category === 'SUPER_HEAVY') {
          // Quad-engine Super Heavy (A380 / B747)
          ctx.moveTo(0, -22);
          ctx.lineTo(6, -6);
          ctx.lineTo(26, 4);
          ctx.lineTo(8, 11);
          ctx.lineTo(4, 18);
          ctx.lineTo(9, 22);
          ctx.lineTo(0, 19);
          ctx.lineTo(-9, 22);
          ctx.lineTo(-4, 18);
          ctx.lineTo(-8, 11);
          ctx.lineTo(-26, 4);
          ctx.lineTo(-6, -6);
          ctx.closePath();
        } else if (category === 'WIDEBODY') {
          // Widebody Twin Jet (B777, B787, A350)
          ctx.moveTo(0, -19);
          ctx.lineTo(5.5, -5);
          ctx.lineTo(21, 5);
          ctx.lineTo(7, 10);
          ctx.lineTo(3.5, 16);
          ctx.lineTo(7.5, 20);
          ctx.lineTo(0, 17);
          ctx.lineTo(-7.5, 20);
          ctx.lineTo(-3.5, 16);
          ctx.lineTo(-7, 10);
          ctx.lineTo(-21, 5);
          ctx.lineTo(-5.5, -5);
          ctx.closePath();
        } else if (category === 'REGIONAL') {
          // Regional Jet (E-Jet, CRJ)
          ctx.moveTo(0, -13);
          ctx.lineTo(3.5, -3);
          ctx.lineTo(13, 2);
          ctx.lineTo(4, 7);
          ctx.lineTo(2, 12);
          ctx.lineTo(4.5, 14);
          ctx.lineTo(0, 12);
          ctx.lineTo(-4.5, 14);
          ctx.lineTo(-2, 12);
          ctx.lineTo(-4, 7);
          ctx.lineTo(-13, 2);
          ctx.lineTo(-3.5, -3);
          ctx.closePath();
        } else if (category === 'TURBOPROP') {
          // Turboprop (ATR 72, Dash 8) - Straight rectangular wings & engines
          ctx.moveTo(0, -14);
          ctx.lineTo(3, -4);
          ctx.lineTo(17, 0);
          ctx.lineTo(4, 3);
          ctx.lineTo(2.5, 13);
          ctx.lineTo(5, 16);
          ctx.lineTo(0, 13.5);
          ctx.lineTo(-5, 16);
          ctx.lineTo(-2.5, 13);
          ctx.lineTo(-4, 3);
          ctx.lineTo(-17, 0);
          ctx.lineTo(-3, -4);
          ctx.closePath();
        } else if (category === 'LIGHT') {
          // Light Piston (Cessna / Piper)
          ctx.moveTo(0, -11);
          ctx.lineTo(2, -2);
          ctx.lineTo(14, -1);
          ctx.lineTo(2, 3);
          ctx.lineTo(1.5, 10);
          ctx.lineTo(3.5, 12);
          ctx.lineTo(0, 10.5);
          ctx.lineTo(-3.5, 12);
          ctx.lineTo(-1.5, 10);
          ctx.lineTo(-2, 3);
          ctx.lineTo(-14, -1);
          ctx.lineTo(-2, -2);
          ctx.closePath();
        } else {
          // Standard Narrowbody Jet (A320 / B737 family)
          ctx.moveTo(0, -15);
          ctx.lineTo(4, -4);
          ctx.lineTo(16, 3);
          ctx.lineTo(4.5, 8);
          ctx.lineTo(2.5, 13);
          ctx.lineTo(5.5, 16);
          ctx.lineTo(0, 13.5);
          ctx.lineTo(-5.5, 16);
          ctx.lineTo(-2.5, 13);
          ctx.lineTo(-4.5, 8);
          ctx.lineTo(-16, 3);
          ctx.lineTo(-4, -4);
          ctx.closePath();
        }

        if (category === 'HELICOPTER') {
          ctx.strokeStyle = '#10b981';
          ctx.lineWidth = 2;
          ctx.stroke();
        } else {
          ctx.fillStyle = category === 'WIDEBODY' || category === 'SUPER_HEAVY' ? '#3b82f6' : '#10b981';
          ctx.shadowColor = '#059669';
          ctx.shadowBlur = 6;
          ctx.fill();
          ctx.shadowBlur = 0;

          ctx.strokeStyle = '#022c22';
          ctx.lineWidth = 1.2;
          ctx.stroke();
        }

        ctx.restore();

        // Label with Callsign + Aircraft Type Code (e.g. BAW123 [B77W])
        const callsign = ac.flight ? ac.flight.trim() : ac.hex;
        const typeCode = ac.t ? `[${ac.t}]` : '';
        ctx.font = 'bold 11px monospace';
        ctx.fillStyle = '#1e293b';
        ctx.fillText(`${callsign} ${typeCode}`, p.x + 14, p.y + 4);
      });

      const sweepLen = Math.max(canvas.width, canvas.height);
      ctx.beginPath();
      ctx.moveTo(centerPoint.x, centerPoint.y);
      ctx.lineTo(
        centerPoint.x + sweepLen * Math.cos(sweepAngle),
        centerPoint.y + sweepLen * Math.sin(sweepAngle)
      );
      ctx.strokeStyle = 'rgba(5, 150, 105, 0.7)';
      ctx.lineWidth = 2;
      ctx.stroke();

      sweepAngle += 0.015;
      requestAnimationFrame(drawRadarScope);
    }

    window.addEventListener('load', () => {
      canvas = document.getElementById('radarCanvas');
      ctx = canvas.getContext('2d');

      initMap();
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      
      requestAnimationFrame(drawRadarScope);
      
      fetchLiveFlights();
    });
  </script>
</body>
</html>
