<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pi 400 Airspace Scope</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(22, 31, 49, 0.85);
      --card-border: #1e2d4a;
      --text-main: #e2e8f0;
      --text-dim: #94a3b8;
      --accent-green: #10b981;
      --accent-blue: #3b82f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 0.6rem 1.5rem;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 50px;
      z-index: 1000;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      background-color: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 12px var(--accent-green); }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    main {
      flex: 1;
      padding: 0.75rem 1rem;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 1rem;
      width: 100%;
      max-width: 1920px;
      margin: 0 auto;
      height: calc(100vh - 190px);
    }

    .radar-wrapper {
      position: relative;
      background: #090d16;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      height: 100%;
      width: 100%;
    }

    #map {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: #090d16;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
      pointer-events: none;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      height: 100%;
      z-index: 10;
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .panel-title {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 0.5rem;
      letter-spacing: 0.05em;
    }

    .aircraft-grid {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
    }

    .ac-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    footer {
      height: 140px;
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid var(--card-border);
      padding: 0.5rem 1rem;
      display: flex;
      align-items: center;
      z-index: 1000;
    }

    .scrollboard {
      width: 100%;
      height: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      padding: 0.5rem 1rem;
      gap: 1.25rem;
    }

    .info-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.2rem;
    }

    .airline-heading {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent-blue);
    }

    .metrics-section {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      min-width: 180px;
      border-left: 1px solid var(--card-border);
      padding-left: 1rem;
    }

    .distance-badge {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--accent-green);
    }
  </style>
</head>
<body>

  <header>
    <h1><span class="pulse-dot"></span> Pi 400 Airspace Scope (50 NM)</h1>
    <div id="connection-status" style="font-size: 0.85rem; color: var(--text-dim);">Status: Initializing...</div>
  </header>

  <main>
    <div class="radar-wrapper" id="radarContainer">
      <div id="map"></div>
      <canvas id="radarCanvas"></canvas>
    </div>

    <aside class="sidebar">
      <div class="panel">
        <div class="panel-title">Live Flights (50 NM Radius)</div>
        <div id="aircraft-grid" class="aircraft-grid">
          <div style="color: var(--text-dim); font-size: 0.85rem;">Searching airspace...</div>
        </div>
        <div id="status-bar" style="font-size:0.7rem; color:var(--text-dim); margin-top:0.5rem;">
          Station Active
        </div>
      </div>
    </aside>
  </main>

  <footer>
    <div class="scrollboard">
      <div class="info-section">
        <div id="sb-airline" class="airline-heading">Searching Airspace Target...</div>
        <div id="sb-type" style="font-size: 0.85rem; color: var(--text-dim);">Type: --</div>
        <div id="sb-route" style="font-size: 0.85rem; color: var(--text-dim);">Location: Directing scope...</div>
      </div>

      <div class="metrics-section">
        <div id="sb-distance" class="distance-badge">-- NM</div>
        <div id="sb-alt" style="font-size: 0.85rem;">Alt: -- ft</div>
        <div id="sb-speed" style="font-size: 0.85rem;">Speed: -- kts</div>
      </div>
    </div>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const ADSB_CONFIG = {
      lat: 52.9529,
      lon: -0.9547,
      radiusNM: 50,
      pollInterval: 15000
    };

    let activeAircraft = [];
    let isFetching = false;
    let map = null;
    let canvas = null;
    let ctx = null;
    let sweepAngle = 0;

    function calcDistanceNM(lat1, lon1, lat2, lon2) {
      const R = 3440.065;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function initMap() {
      map = L.map('map', {
        zoomControl: false,
        attributionControl: false,
        dragging: false,
        scrollWheelZoom: false,
        doubleClickZoom: false,
        boxZoom: false,
        keyboard: false
      }).setView([ADSB_CONFIG.lat, ADSB_CONFIG.lon], 8);

      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 16
      }).addTo(map);

      const radiusMeters = ADSB_CONFIG.radiusNM * 1852;
      
      L.circle([ADSB_CONFIG.lat, ADSB_CONFIG.lon], {
        color: '#00ff9d',
        weight: 5,
        opacity: 1.0,
        fillColor: '#10b981',
        fillOpacity: 0.08,
        radius: radiusMeters
      }).addTo(map);

      L.circle([ADSB_CONFIG.lat, ADSB_CONFIG.lon], {
        color: '#ffffff',
        weight: 1.5,
        dashArray: '10, 10',
        opacity: 0.8,
        fill: false,
        radius: radiusMeters + 1200
      }).addTo(map);
    }

    function resizeCanvas() {
      if (!canvas) return;
      const container = document.getElementById('radarContainer');
      const rect = container.getBoundingClientRect();
      
      canvas.width = rect.width;
      canvas.height = rect.height;

      if (map) {
        map.invalidateSize();
      }
    }

    async function fetchADSBData() {
      if (isFetching) return;
      isFetching = true;

      const url = `https://api.adsb.lol/v2/lat/${ADSB_CONFIG.lat}/lon/${ADSB_CONFIG.lon}/dist/${ADSB_CONFIG.radiusNM}`;

      try {
        const response = await fetch(url, { mode: 'cors' });
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        
        const data = await response.json();
        activeAircraft = data.ac || data.aircraft || [];
        
        updateConnectionStatus(`Status: Tracking ${activeAircraft.length} targets`);
        renderFlightBoard(activeAircraft);
        updateNearestScrollboard(activeAircraft);
      } catch (err) {
        console.warn("Primary fetch failed, checking connection...", err);
        updateConnectionStatus("Status: Connection Retry...");
      } finally {
        isFetching = false;
      }
    }

    function updateConnectionStatus(msg) {
      const statusEl = document.getElementById('connection-status');
      if (statusEl) statusEl.textContent = msg;
    }

    function renderFlightBoard(acList) {
      const gridEl = document.getElementById('aircraft-grid');
      if (!gridEl) return;
      gridEl.innerHTML = '';

      const validFlights = acList.filter(ac => {
        if (!ac.lat || !ac.lon) return false;
        const dist = calcDistanceNM(ADSB_CONFIG.lat, ADSB_CONFIG.lon, ac.lat, ac.lon);
        return dist <= ADSB_CONFIG.radiusNM;
      });

      if (validFlights.length === 0) {
        gridEl.innerHTML = '<div style="color: var(--text-dim); font-size: 0.85rem;">No flights detected in 50 NM</div>';
        return;
      }

      // Sort by closest distance first
      validFlights.sort((a, b) => {
        const distA = calcDistanceNM(ADSB_CONFIG.lat, ADSB_CONFIG.lon, a.lat, a.lon);
        const distB = calcDistanceNM(ADSB_CONFIG.lat, ADSB_CONFIG.lon, b.lat, b.lon);
        return distA - distB;
      });

      validFlights.forEach(ac => {
        const flightName = ac.flight ? ac.flight.trim() : (ac.hex ? ac.hex.toUpperCase() : 'N/A');
        const planeType = ac.t || 'AIR';
        const alt = ac.alt_baro === 'ground' ? 'Ground' : `${ac.alt_baro || ac.alt_geom || 0} ft`;
        const speed = ac.gs !== undefined ? `${Math.round(ac.gs)} kts` : 'N/A';
        const dist = calcDistanceNM(ADSB_CONFIG.lat, ADSB_CONFIG.lon, ac.lat, ac.lon);

        const card = document.createElement('div');
        card.className = 'ac-card';
        card.innerHTML = `
          <div>
            <div style="font-weight:bold; font-size:0.95rem; color:#f8fafc;">${flightName}</div>
            <div style="font-size:0.75rem; color:var(--text-dim);">${planeType} • ${speed}</div>
          </div>
          <div style="text-align:right;">
            <div style="font-weight:bold; color:var(--accent-green);">${dist.toFixed(1)} NM</div>
            <div style="font-size:0.75rem; color:var(--text-dim);">${alt}</div>
          </div>
        `;
        gridEl.appendChild(card);
      });
    }

    function updateNearestScrollboard(acList) {
      const valid = acList.filter(ac => ac.lat && ac.lon && calcDistanceNM(ADSB_CONFIG.lat, ADSB_CONFIG.lon, ac.lat, ac.lon) <= ADSB_CONFIG.radiusNM);
      if (valid.length === 0) {
        document.getElementById('sb-airline').innerText = "Searching Airspace Target...";
        document.getElementById('sb-type').innerText = "Type: --";
        document.getElementById('sb-route').innerText = "Location: Directing scope...";
        document.getElementById('sb-distance').innerText = "-- NM";
        document.getElementById('sb-alt').innerText = "Alt: -- ft";
        document.getElementById('sb-speed').innerText = "Speed: -- kts";
        return;
      }

      valid.sort((a, b) => calcDistanceNM(ADSB_CONFIG.lat, ADSB_CONFIG.lon, a.lat, a.lon) - calcDistanceNM(ADSB_CONFIG.lat, ADSB_CONFIG.lon, b.lat, b.lon));

      const nearest = valid[0];
      const dist = calcDistanceNM(ADSB_CONFIG.lat, ADSB_CONFIG.lon, nearest.lat, nearest.lon);
      const callsign = nearest.flight ? nearest.flight.trim() : nearest.hex;
      const altDisplay = nearest.alt_baro === 'ground' ? 'Ground' : `${nearest.alt_baro || 0} ft`;

      document.getElementById('sb-distance').innerText = `${dist.toFixed(1)} NM`;
      document.getElementById('sb-alt').innerText = `Alt: ${altDisplay}`;
      document.getElementById('sb-speed').innerText = `Speed: ${Math.round(nearest.gs || 0)} kts`;
      document.getElementById('sb-airline').innerText = callsign;
      document.getElementById('sb-type').innerText = `Type: ${nearest.t || 'N/A'}`;
      document.getElementById('sb-route').innerText = `Target Lat/Lon: ${nearest.lat.toFixed(2)}°, ${nearest.lon.toFixed(2)}°`;
    }

    function drawRadarScope() {
      if (!ctx || !canvas || !map) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const centerPoint = map.latLngToContainerPoint([ADSB_CONFIG.lat, ADSB_CONFIG.lon]);
      const outerEdgeLatLng = [ADSB_CONFIG.lat + 0.833, ADSB_CONFIG.lon];
      const outerEdgePoint = map.latLngToContainerPoint(outerEdgeLatLng);
      const radiusPx = Math.abs(centerPoint.y - outerEdgePoint.y);

      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(16, 185, 129, 0.35)';
      ctx.setLineDash([4, 4]);

      [0.2, 0.4, 0.6, 0.8].forEach(step => {
        ctx.beginPath();
        ctx.arc(centerPoint.x, centerPoint.y, radiusPx * step, 0, Math.PI * 2);
        ctx.stroke();
      });

      ctx.beginPath();
      ctx.moveTo(centerPoint.x - radiusPx, centerPoint.y);
      ctx.lineTo(centerPoint.x + radiusPx, centerPoint.y);
      ctx.moveTo(centerPoint.x, centerPoint.y - radiusPx);
      ctx.lineTo(centerPoint.x, centerPoint.y + radiusPx);
      ctx.stroke();

      ctx.setLineDash([]);

      activeAircraft.forEach(ac => {
        if (!ac.lat || !ac.lon) return;

        const distNM = calcDistanceNM(ADSB_CONFIG.lat, ADSB_CONFIG.lon, ac.lat, ac.lon);
        if (distNM > ADSB_CONFIG.radiusNM) return;

        const p = map.latLngToContainerPoint([ac.lat, ac.lon]);

        ctx.beginPath();
        ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
        ctx.fillStyle = '#10b981';
        ctx.shadowColor = '#10b981';
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.font = 'bold 11px monospace';
        ctx.fillStyle = '#ffffff';
        const label = ac.flight ? ac.flight.trim() : ac.hex;
        ctx.fillText(label, p.x + 8, p.y + 4);
      });

      const sweepLen = Math.max(canvas.width, canvas.height);
      ctx.beginPath();
      ctx.moveTo(centerPoint.x, centerPoint.y);
      ctx.lineTo(
        centerPoint.x + sweepLen * Math.cos(sweepAngle),
        centerPoint.y + sweepLen * Math.sin(sweepAngle)
      );
      ctx.strokeStyle = 'rgba(16, 185, 129, 0.8)';
      ctx.lineWidth = 2;
      ctx.stroke();

      sweepAngle += 0.015;
      requestAnimationFrame(drawRadarScope);
    }

    function pollADSB() {
      setInterval(async () => {
        await fetchADSBData();
      }, ADSB_CONFIG.pollInterval);
    }

    window.addEventListener('load', () => {
      canvas = document.getElementById('radarCanvas');
      ctx = canvas.getContext('2d');
      
      document.getElementById('status-bar').innerText = `Station: ${ADSB_CONFIG.lat.toFixed(4)}° N, ${ADSB_CONFIG.lon.toFixed(4)}° W (${ADSB_CONFIG.radiusNM} NM)`;

      initMap();
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      
      requestAnimationFrame(drawRadarScope);
      fetchADSBData();
      pollADSB();
    });
  </script>
</body>
</html>
