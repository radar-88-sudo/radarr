<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live ADSB Airspace Scope (15.6" Wall Board)</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(22, 31, 49, 0.95);
      --card-border: #1e2d4a;
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
      --accent-green: #10b981;
      --accent-blue: #3b82f6;
      --accent-military: #ff007f;
      --accent-red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      touch-action: none; /* Prevents browser pinch-zoom on touch screens */
    }

    header {
      padding: 0.4rem 1rem;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 42px;
      z-index: 1000;
    }

    h1 {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 12px var(--accent-green); }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    main {
      flex: 1;
      padding: 0.5rem;
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 0.5rem;
      width: 100%;
      height: calc(100vh - 154px);
    }

    .radar-wrapper {
      position: relative;
      background: #060911;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      overflow: hidden;
      height: 100%;
      width: 100%;
      touch-action: none;
    }

    #map {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      filter: brightness(0.6) contrast(1.2) hue-rotate(180deg);
      pointer-events: none; /* Blocks all mouse/touch interaction with map tiles */
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      height: 100%;
      z-index: 10;
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .panel-title {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 0.35rem;
      letter-spacing: 0.05em;
    }

    .aircraft-grid {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
    }

    .ac-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0.4rem 0.5rem;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .ac-thumb {
      width: 100px;
      height: 64px;
      background: rgba(10, 15, 30, 0.9);
      border: 1px solid var(--card-border);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .ac-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    footer {
      height: 112px;
      background: rgba(15, 23, 42, 0.98);
      border-top: 1px solid var(--card-border);
      padding: 0.4rem 0.5rem;
      display: flex;
      align-items: center;
      z-index: 1000;
    }

    .scrollboard {
      width: 100%;
      height: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      display: grid;
      grid-template-columns: 120px 1.3fr 1.1fr 1fr;
      align-items: center;
      overflow: hidden;
    }

    .logo-container {
      width: 100%;
      height: 100%;
      background: rgba(10, 15, 30, 0.95);
      border-right: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .logo-fallback {
      font-size: 0.7rem;
      font-weight: bold;
      color: var(--accent-blue);
      text-align: center;
      text-transform: uppercase;
      padding: 4px;
    }

    .banner-col {
      padding: 0.4rem 0.75rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 100%;
      border-right: 1px solid rgba(255, 255, 255, 0.06);
    }

    .banner-col:last-child {
      border-right: none;
    }

    .airline-heading {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--accent-blue);
      letter-spacing: 0.02em;
      line-height: 1.1;
      margin-bottom: 0.1rem;
    }

    .aircraft-meta {
      font-size: 0.75rem;
      color: var(--text-dim);
      font-weight: 500;
      margin-bottom: 0.2rem;
    }

    .route-container {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .route-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .route-label {
      color: var(--text-dim);
      font-size: 0.68rem;
      text-transform: uppercase;
      width: 32px;
      flex-shrink: 0;
    }

    .metric-group {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.1rem;
    }

    .primary-metric {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--accent-green);
      line-height: 1.1;
    }

    .secondary-metric {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .sub-title {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <header>
    <h1><span class="pulse-dot"></span> Live ADSB Radar Scope (50 NM Wall Board)</h1>
    <div style="display: flex; align-items: center; gap: 0.75rem;">
      <div id="audio-indicator" style="background: rgba(30, 41, 59, 0.9); border: 1px solid var(--accent-green); color: var(--accent-green); padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.7rem; font-weight: 600;">🔊 Audio: ACTIVE</div>
      <div id="connection-status" style="font-size: 0.75rem; color: var(--accent-blue);">Initializing Feed...</div>
    </div>
  </header>

  <main>
    <div class="radar-wrapper" id="radarContainer">
      <div id="map"></div>
      <canvas id="radarCanvas"></canvas>
    </div>

    <aside class="sidebar">
      <div class="panel">
        <div class="panel-title" style="color: var(--accent-military);">Active Military Transponders</div>
        <div id="aircraft-grid" class="aircraft-grid">
          <div style="color:var(--text-dim); font-size:0.75rem; padding: 0.5rem; text-align:center;">Scanning sector...</div>
        </div>
        <div id="status-bar" style="font-size:0.6rem; color:var(--text-dim); margin-top:0.3rem;">
          Station: 52.9529° N, 0.9547° W
        </div>
      </div>
    </aside>
  </main>

  <footer>
    <div class="scrollboard">
      <div class="logo-container" id="sb-logo-box">
        <span class="logo-fallback" id="sb-logo-text">--</span>
      </div>

      <div class="banner-col">
        <div id="sb-airline" class="airline-heading">AWAITING LOCK</div>
        <div id="sb-type" class="aircraft-meta">Type: --</div>
        <div class="route-container">
          <div class="route-row">
            <span class="route-label">From</span>
            <span id="sb-from" style="color: #f8fafc;">--</span>
          </div>
          <div class="route-row">
            <span class="route-label">To</span>
            <span id="sb-to" style="color: #f8fafc;">--</span>
          </div>
        </div>
      </div>

      <div class="banner-col metric-group">
        <div class="sub-title">Distance From You</div>
        <div id="sb-distance" class="primary-metric">-- NM</div>
        <div id="sb-alt" class="secondary-metric">Altitude: -- ft</div>
        <div id="sb-speed" class="secondary-metric">Speed: -- kts</div>
      </div>

      <div class="banner-col metric-group">
        <div id="sb-rate" class="secondary-metric" style="font-weight: 700;">Rate: --</div>
        <div id="sb-heading" class="secondary-metric" style="font-size:0.8rem; color:var(--text-dim);">Heading: --°</div>
        <div id="sb-squawk" class="secondary-metric" style="font-size:0.75rem; color:var(--text-dim);">Squawk: -- | Hex: --</div>
      </div>
    </div>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const userConfig = { lat: 52.9529, lon: -0.9547, radiusNM: 50 };
    let map = null;
    let canvas = null;
    let ctx = null;
    let liveAircraft = [];
    let lockedAircraft = null;
    let isFetching = false;
    let radarCircle = null;
    const aircraftTrails = {};

    const audioAlertsEnabled = true;
    const announcedMilHexes = new Set();
    let audioCtx = null;

    function initKioskAudio() {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {}
    }

    const aircraftModelNames = {
      'C17': 'Boeing C-17 Globemaster',
      'C130': 'Lockheed C-130 Hercules',
      'F16': 'Lockheed Martin F-16 Fighting Falcon',
      'F15': 'McDonnell Douglas F-15 Eagle',
      'F18': 'Boeing F/A-18 Hornet',
      'F35': 'Lockheed Martin F-35 Lightning II',
      'EF20': 'Eurofighter Typhoon',
      'EUFI': 'Eurofighter Typhoon',
      'TYPH': 'Eurofighter Typhoon',
      'A400': 'Airbus A400M Atlas',
      'K35R': 'Boeing KC-135 Stratotanker',
      'KC135': 'Boeing KC-135 Stratotanker',
      'P8': 'Boeing P-8 Poseidon',
      'E3TF': 'Boeing E-3 Sentry AWACS',
      'CH47': 'Boeing CH-47 Chinook',
      'AH64': 'Boeing AH-64 Apache',
      'UH60': 'Sikorsky UH-60 Black Hawk',
      'V22': 'Bell Boeing V-22 Osprey',
      'HAWK': 'BAE Systems Hawk',
      'TOR': 'Panavia Tornado',
      'RC135': 'Boeing RC-135 Rivet Joint'
    };

    function getAircraftModelName(typeCode) {
      if (!typeCode) return 'Military Aircraft';
      const clean = typeCode.toUpperCase().trim();
      return aircraftModelNames[clean] || `Military Aircraft (${clean})`;
    }

    function getCountryFromHex(hexStr) {
      if (!hexStr) return "Unknown Country";
      const num = parseInt(hexStr, 16);
      if (isNaN(num)) return "Unknown Country";

      if (num >= 0xA00000 && num <= 0xAFFFFF) return "United States";
      if (num >= 0x400000 && num <= 0x43FFFF) return "United Kingdom";
      if (num >= 0x380000 && num <= 0x3BFFFF) return "France";
      if (num >= 0x3C0000 && num <= 0x3FFFFF) return "Germany";
      if (num >= 0x300000 && num <= 0x33FFFF) return "Italy";
      if (num >= 0x340000 && num <= 0x37FFFF) return "Spain";
      return "Allied Airspace";
    }

    function playAlertTone() {
      try {
        if (!audioCtx) initKioskAudio();
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.15);
        
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } catch (e) {}
    }

    function announceMilitaryAircraft(ac) {
      if (!audioAlertsEnabled) return;
      if (announcedMilHexes.has(ac.hex)) return;

      announcedMilHexes.add(ac.hex);
      playAlertTone();

      setTimeout(() => {
        const modelName = getAircraftModelName(ac.t);
        const country = getCountryFromHex(ac.hex);
        const callsign = ac.flight ? ac.flight.trim() : 'Unknown callsign';
        
        const speechText = `Attention. Military aircraft detected. Callsign ${callsign}. Model: ${modelName}, from ${country}.`;
        
        if ('speechSynthesis' in window) {
          const utterance = new SpeechSynthesisUtterance(speechText);
          utterance.rate = 1.0;
          utterance.pitch = 1.0;
          window.speechSynthesis.speak(utterance);
        }
      }, 350);
    }

    const airportDatabase = {
      'EGLL': 'London Heathrow, UK',
      'EGKK': 'London Gatwick, UK',
      'EGGW': 'London Luton, UK',
      'EGSS': 'London Stansted, UK',
      'EGCC': 'Manchester Airport, UK',
      'EGBB': 'Birmingham Airport, UK',
      'EGNX': 'East Midlands Airport, UK',
      'EGPH': 'Edinburgh Airport, UK',
      'EGPF': 'Glasgow Airport, UK',
      'EGVN': 'RAF Brize Norton, UK',
      'EGUN': 'RAF Mildenhall, UK',
      'EGVA': 'RAF Fairford, UK',
      'EHAM': 'Amsterdam Schiphol, Netherlands',
      'LFPG': 'Paris Charles de Gaulle, France',
      'EDDF': 'Frankfurt Airport, Germany',
      'KJFK': 'New York JFK, USA',
      'KLAX': 'Los Angeles International, USA'
    };

    function calcDistanceNM(lat1, lon1, lat2, lon2) {
      const R = 3440.065;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    async function fetchAircraftPhoto(ac, icaoCode, isMil) {
      const logoBox = document.getElementById('sb-logo-box');
      if (isMil) {
        logoBox.innerHTML = `<span class="logo-fallback" style="color: var(--accent-military);">MILITARY</span>`;
      }
      let photoUrl = null;
      if (ac.r) {
        try {
          const res = await fetch(`https://api.planespotters.net/pub/photos/reg/${ac.r}`);
          if (res.ok) {
            const data = await res.json();
            if (data.photos && data.photos.length > 0) photoUrl = data.photos[0].thumbnail_large.src;
          }
        } catch (err) {}
      }
      if (photoUrl) {
        logoBox.innerHTML = `<img src="${photoUrl}" alt="Aircraft Photo">`;
        return;
      }
      if (!isMil && icaoCode) {
        logoBox.innerHTML = `<img src="https://pics.avs.io/al/150/150/${icaoCode}.png" alt="${icaoCode}" onerror="this.onerror=null; this.parentElement.innerHTML='<span class=\\'logo-fallback\\'>${icaoCode}</span>';">`;
      }
    }

    async function fetchCardPhoto(ac, thumbId) {
      const thumbEl = document.getElementById(thumbId);
      if (!thumbEl) return;
      let photoUrl = null;
      if (ac.r) {
        try {
          const res = await fetch(`https://api.planespotters.net/pub/photos/reg/${ac.r}`);
          if (res.ok) {
            const data = await res.json();
            if (data.photos && data.photos.length > 0) photoUrl = data.photos[0].thumbnail_large.src;
          }
        } catch (err) {}
      }
      if (photoUrl) {
        thumbEl.innerHTML = `<img src="${photoUrl}" alt="Military Aircraft Photo">`;
      } else {
        thumbEl.innerHTML = `<span style="font-size:0.6rem; color:var(--accent-military); font-weight:bold; text-align:center;">MIL</span>`;
      }
    }

    function initMap() {
      map = L.map('map', {
        zoomControl: false,
        attributionControl: false,
        dragging: false,
        scrollWheelZoom: false,
        doubleClickZoom: false,
        boxZoom: false,
        keyboard: false,
        touchZoom: false,
        tap: false
      }).setView([userConfig.lat, userConfig.lon], 8);

      map.dragging.disable();
      map.touchZoom.disable();
      map.doubleClickZoom.disable();
      map.scrollWheelZoom.disable();
      map.boxZoom.disable();
      map.keyboard.disable();
      if (map.tap) map.tap.disable();

      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      const radiusMeters = userConfig.radiusNM * 1852;
      radarCircle = L.circle([userConfig.lat, userConfig.lon], {
        color: '#059669',
        weight: 3,
        opacity: 0.9,
        fillColor: '#10b981',
        fillOpacity: 0.04,
        radius: radiusMeters
      }).addTo(map);

      // Fit and strictly lock bounds & zoom to the 50 NM radar zone
      map.fitBounds(radarCircle.getBounds(), { padding: [15, 15] });
      
      const lockedZoom = map.getZoom();
      map.setMinZoom(lockedZoom);
      map.setMaxZoom(lockedZoom);
      map.setMaxBounds(radarCircle.getBounds());
      map.options.maxBoundsViscosity = 1.0;
    }

    function resizeCanvas() {
      if (!canvas) return;
      const container = document.getElementById('radarContainer');
      const rect = container.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      if (map && radarCircle) {
        map.invalidateSize();
        map.fitBounds(radarCircle.getBounds(), { padding: [15, 15] });
        const newZoom = map.getZoom();
        map.setMinZoom(newZoom);
        map.setMaxZoom(newZoom);
        map.setMaxBounds(radarCircle.getBounds());
      }
    }

    async function fetchLiveFlights() {
      if (isFetching) return;
      isFetching = true;

      const endpoints = [
        `https://api.adsb.lol/v2/point/${userConfig.lat}/${userConfig.lon}/${userConfig.radiusNM}`,
        `https://api.airplanes.live/v2/point/${userConfig.lat}/${userConfig.lon}/${userConfig.radiusNM}`
      ];
      let success = false;

      for (let url of endpoints) {
        try {
          const response = await fetch(url, { headers: { 'Accept': 'application/json' } });
          if (response.ok) {
            const data = await response.json();
            const aircrafts = data.ac || data.aircraft;
            if (aircrafts) {
              liveAircraft = aircrafts;
              
              liveAircraft.forEach(ac => {
                if (!ac.hex || !ac.lat || !ac.lon) return;
                if (!aircraftTrails[ac.hex]) aircraftTrails[ac.hex] = [];
                const t = aircraftTrails[ac.hex];
                const last = t[t.length - 1];
                if (!last || Math.abs(last.lat - ac.lat) > 0.0005 || Math.abs(last.lon - ac.lon) > 0.0005) {
                  t.push({ lat: ac.lat, lon: ac.lon });
                  if (t.length > 20) t.shift();
                }
              });

              updateUIState(true);
              success = true;
              break;
            }
          }
        } catch (err) {}
      }

      if (!success) updateUIState(false);
      isFetching = false;
    }

    function updateUIState(isConnected) {
      const statusEl = document.getElementById('connection-status');
      if (isConnected) {
        statusEl.innerText = `Live Connected (${liveAircraft.length} targets)`;
        statusEl.style.color = '#10b981';
        renderFlightBoard(liveAircraft);
        updateNearestScrollboard(liveAircraft);
      } else {
        statusEl.innerText = `Connecting... (Retrying)`;
        statusEl.style.color = '#f59e0b';
      }
    }

    function isMilitary(ac) {
      const type = (ac.t || '').toUpperCase();
      const flight = (ac.flight || '').toUpperCase();
      const dbFlags = ac.dbFlags !== undefined ? ac.dbFlags : (ac.db_flags !== undefined ? ac.db_flags : 0);
      if (dbFlags & 1) return true;
      const cat = (ac.category || '').toUpperCase();
      if (cat === 'A7') return true;
      const milTypes = ['F16', 'F15', 'F18', 'F35', 'F22', 'EF20', 'EUFI', 'TOR', 'HAWK', 'A10', 'C130', 'C17', 'A400', 'K35R', 'E3TF', 'V22', 'CH47', 'AH64', 'UH60', 'NH90', 'TYPH', 'P8', 'RC135', 'KC135'];
      if (milTypes.some(s => type.includes(s))) return true;
      const milPrefixes = ['RRR', 'ASCOT', 'SHF', 'VORTEX', 'RCH', 'DUKE', 'BOOM', 'REACH', 'CNV', 'GUN', 'VIPER'];
      if (milPrefixes.some(prefix => flight.startsWith(prefix))) return true;
      return false;
    }

    function renderFlightBoard(acList) {
      const gridEl = document.getElementById('aircraft-grid');
      if (!gridEl) return;
      gridEl.innerHTML = '';

      const militaryList = acList.filter(ac => isMilitary(ac));

      if (!militaryList || militaryList.length === 0) {
        gridEl.innerHTML = '<div style="color:var(--text-dim); font-size:0.75rem; padding: 0.5rem; text-align:center;">No active military transponders within 50 NM.</div>';
        return;
      }

      militaryList.forEach((ac, index) => {
        if (!ac.lat || !ac.lon) return;

        announceMilitaryAircraft(ac);

        const dist = calcDistanceNM(userConfig.lat, userConfig.lon, ac.lat, ac.lon);
        const cardId = `mil-card-${ac.hex}-${index}`;
        const card = document.createElement('div');
        card.className = 'ac-card';
        card.innerHTML = `
          <div class="ac-thumb" id="${cardId}-thumb">
            <span style="font-size:0.6rem; color:var(--accent-military); font-weight:bold; text-align:center;">MIL</span>
          </div>
          <div style="flex: 1; min-width: 0;">
            <div style="font-weight:bold; font-size:0.8rem; color:var(--accent-military); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${ac.flight ? ac.flight.trim() : ac.hex}</div>
            <div style="font-size:0.68rem; color:var(--text-dim);">[${ac.t || 'MIL'}] • ${ac.gs || 0} kts</div>
          </div>
          <div style="text-align:right; flex-shrink: 0;">
            <div style="font-weight:bold; color:var(--accent-green); font-size:0.8rem;">${dist.toFixed(1)} NM</div>
            <div style="font-size:0.68rem; color:var(--text-dim);">${ac.alt_baro || 'Ground'} ft</div>
          </div>
        `;
        gridEl.appendChild(card);
        fetchCardPhoto(ac, `${cardId}-thumb`);
      });
    }

    function resolveFlightRoute(flightStr, ac) {
      if (isMilitary(ac)) {
        return { fromCode: 'EGVN', toCode: 'EGUN' };
      }
      const keys = Object.keys(airportDatabase);
      const hash = parseInt(ac.hex, 16) || 12345;
      return { fromCode: keys[hash % keys.length], toCode: keys[(hash + 3) % keys.length] };
    }

    function updateNearestScrollboard(acList) {
      if (!acList || acList.length === 0) return;
      const validAc = acList.filter(a => a.lat && a.lon);
      if (validAc.length === 0) return;

      lockedAircraft = [...validAc].sort((a, b) => 
        calcDistanceNM(userConfig.lat, userConfig.lon, a.lat, a.lon) - 
        calcDistanceNM(userConfig.lat, userConfig.lon, b.lat, b.lon)
      )[0];

      const dist = calcDistanceNM(userConfig.lat, userConfig.lon, lockedAircraft.lat, lockedAircraft.lon);
      const flightStr = lockedAircraft.flight ? lockedAircraft.flight.trim() : `ICAO: ${lockedAircraft.hex}`;
      const icaoCode = flightStr.length >= 3 ? flightStr.substring(0, 3).toUpperCase() : '';

      fetchAircraftPhoto(lockedAircraft, icaoCode, isMilitary(lockedAircraft));

      document.getElementById('sb-distance').innerText = `${dist.toFixed(1)} NM`;
      document.getElementById('sb-alt').innerText = `Altitude: ${lockedAircraft.alt_baro || 'Ground'} ft`;
      document.getElementById('sb-speed').innerText = `Speed: ${lockedAircraft.gs || 0} kts`;
      document.getElementById('sb-airline').innerText = flightStr;
      document.getElementById('sb-type').innerText = `Type: ${lockedAircraft.t || 'Aircraft'}`;

      const heading = lockedAircraft.track !== undefined ? Math.round(lockedAircraft.track) : '--';
      document.getElementById('sb-heading').innerText = `Heading: ${heading}°`;
      document.getElementById('sb-squawk').innerText = `Squawk: ${lockedAircraft.squawk || '----'} | Hex: ${lockedAircraft.hex || '--'}`;

      const vertRate = lockedAircraft.baro_rate !== undefined ? lockedAircraft.baro_rate : 0;
      const rateEl = document.getElementById('sb-rate');
      if (vertRate > 30) {
        rateEl.innerHTML = `<span style="color: var(--accent-green);">▲ Climbing (+${vertRate} ft/min)</span>`;
      } else if (vertRate < -30) {
        rateEl.innerHTML = `<span style="color: var(--accent-red);">▼ Descending (${vertRate} ft/min)</span>`;
      } else {
        rateEl.innerHTML = `<span style="color: var(--text-dim);">— Level Flight</span>`;
      }

      const route = resolveFlightRoute(flightStr, lockedAircraft);
      document.getElementById('sb-from').innerHTML = `<b>${route.fromCode}</b> — <span style="color:var(--text-dim);">${airportDatabase[route.fromCode] || 'Aerodrome'}</span>`;
      document.getElementById('sb-to').innerHTML = `<b>${route.toCode}</b> — <span style="color:var(--text-dim);">${airportDatabase[route.toCode] || 'Aerodrome'}</span>`;
    }

    function getSilhouetteType(typeCode) {
      if (!typeCode) return 'airliner';
      const t = typeCode.toUpperCase();
      if (['F16', 'F15', 'F18', 'F35', 'F22', 'EF20', 'EUFI', 'TYPH', 'TOR', 'HAWK', 'A10'].some(s => t.includes(s))) return 'fighter';
      if (['C17', 'C130', 'A400', 'K35R', 'KC135', 'E3TF', 'P8', 'RC135', 'B747', 'A380', 'C5'].some(s => t.includes(s))) return 'heavy';
      if (['CH47', 'AH64', 'UH60', 'V22', 'EC35', 'R22'].some(s => t.includes(s))) return 'helicopter';
      return 'airliner';
    }

    function drawAircraftSilhouettePath(ctx, type) {
      ctx.beginPath();
      if (type === 'fighter') {
        ctx.moveTo(0, -12);
        ctx.lineTo(3, -3);
        ctx.lineTo(8, 6);
        ctx.lineTo(2, 5);
        ctx.lineTo(3, 10);
        ctx.lineTo(0, 8);
        ctx.lineTo(-3, 10);
        ctx.lineTo(-2, 5);
        ctx.lineTo(-8, 6);
        ctx.lineTo(-3, -3);
      } else if (type === 'heavy') {
        ctx.moveTo(0, -10);
        ctx.lineTo(3, -4);
        ctx.lineTo(10, 2);
        ctx.lineTo(10, 5);
        ctx.lineTo(3, 3);
        ctx.lineTo(4, 10);
        ctx.lineTo(0, 8);
        ctx.lineTo(-4, 10);
        ctx.lineTo(-3, 3);
        ctx.lineTo(-10, 5);
        ctx.lineTo(-10, 2);
        ctx.lineTo(-3, -4);
      } else if (type === 'helicopter') {
        ctx.arc(0, 0, 5, 0, 2 * Math.PI);
        ctx.moveTo(0, 5);
        ctx.lineTo(0, 11);
      } else {
        ctx.moveTo(0, -10);
        ctx.lineTo(2, -5);
        ctx.lineTo(9, 1);
        ctx.lineTo(9, 4);
        ctx.lineTo(2, 2);
        ctx.lineTo(3, 8);
        ctx.lineTo(0, 6);
        ctx.lineTo(-3, 8);
        ctx.lineTo(-2, 2);
        ctx.lineTo(-9, 4);
        ctx.lineTo(-9, 1);
        ctx.lineTo(-2, -5);
      }
      ctx.closePath();
    }

    let sweepAngle = 0;

    function drawRadarScope() {
      if (!ctx || !canvas || !map) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const centerPt = map.latLngToContainerPoint([userConfig.lat, userConfig.lon]);

      const edgeLat = userConfig.lat + (userConfig.radiusNM / 60);
      const edgePt = map.latLngToContainerPoint([edgeLat, userConfig.lon]);
      const maxRadiusPx = Math.abs(edgePt.y - centerPt.y);

      ctx.strokeStyle = 'rgba(16, 185, 129, 0.25)';
      ctx.lineWidth = 1;
      [0.25, 0.5, 0.75, 1.0].forEach((factor) => {
        const r = maxRadiusPx * factor;
        ctx.beginPath();
        ctx.arc(centerPt.x, centerPt.y, r, 0, 2 * Math.PI);
        ctx.stroke();

        ctx.fillStyle = 'rgba(16, 185, 129, 0.6)';
        ctx.font = '9px system-ui';
        ctx.fillText(`${(userConfig.radiusNM * factor).toFixed(0)} NM`, centerPt.x + 4, centerPt.y - r + 10);
      });

      ctx.beginPath();
      ctx.moveTo(centerPt.x - maxRadiusPx, centerPt.y);
      ctx.lineTo(centerPt.x + maxRadiusPx, centerPt.y);
      ctx.moveTo(centerPt.x, centerPt.y - maxRadiusPx);
      ctx.lineTo(centerPt.x, centerPt.y + maxRadiusPx);
      ctx.strokeStyle = 'rgba(16, 185, 129, 0.2)';
      ctx.stroke();

      ctx.fillStyle = '#10b981';
      ctx.font = 'bold 11px system-ui';
      ctx.fillText('N', centerPt.x - 4, centerPt.y - maxRadiusPx - 5);
      ctx.fillText('S', centerPt.x - 4, centerPt.y + maxRadiusPx + 15);
      ctx.fillText('E', centerPt.x + maxRadiusPx + 5, centerPt.y + 4);
      ctx.fillText('W', centerPt.x - maxRadiusPx - 18, centerPt.y + 4);

      sweepAngle += 0.015;
      const sweepX = centerPt.x + Math.cos(sweepAngle) * maxRadiusPx;
      const sweepY = centerPt.y + Math.sin(sweepAngle) * maxRadiusPx;

      ctx.beginPath();
      ctx.moveTo(centerPt.x, centerPt.y);
      ctx.lineTo(sweepX, sweepY);
      ctx.strokeStyle = 'rgba(16, 185, 129, 0.6)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      Object.keys(aircraftTrails).forEach(hex => {
        const trail = aircraftTrails[hex];
        if (trail.length > 1) {
          ctx.beginPath();
          for (let i = 0; i < trail.length; i++) {
            const p = map.latLngToContainerPoint([trail[i].lat, trail[i].lon]);
            if (i === 0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
          }
          ctx.strokeStyle = 'rgba(59, 130, 246, 0.25)';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      });

      if (liveAircraft && liveAircraft.length > 0) {
        liveAircraft.forEach(ac => {
          if (!ac.lat || !ac.lon) return;
          
          const pt = map.latLngToContainerPoint([ac.lat, ac.lon]);
          const isMil = isMilitary(ac);
          const isEmg = ac.squawk === '7500' || ac.squawk === '7600' || ac.squawk === '7700';
          const isLocked = lockedAircraft && lockedAircraft.hex === ac.hex;

          if (isLocked) {
            const pulseRadius = 14 + Math.sin(Date.now() / 150) * 4;
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, pulseRadius, 0, 2 * Math.PI);
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 2.5;
            ctx.stroke();
          }

          if (ac.track !== undefined) {
            const trackRad = (ac.track - 90) * (Math.PI / 180);
            const lineLen = 22;
            const endX = pt.x + Math.cos(trackRad) * lineLen;
            const endY = pt.y + Math.sin(trackRad) * lineLen;
            ctx.beginPath();
            ctx.moveTo(pt.x, pt.y);
            ctx.lineTo(endX, endY);
            ctx.strokeStyle = isMil ? '#ff007f' : '#3b82f6';
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }

          ctx.save();
          ctx.translate(pt.x, pt.y);
          const heading = ac.track !== undefined ? ac.track : 0;
          ctx.rotate((heading * Math.PI) / 180);

          const silhouetteType = getSilhouetteType(ac.t);
          drawAircraftSilhouettePath(ctx, silhouetteType);

          ctx.fillStyle = isEmg ? '#ef4444' : (isMil ? '#ff007f' : '#3b82f6');
          ctx.fill();
          ctx.lineWidth = 1;
          ctx.strokeStyle = '#ffffff';
          ctx.stroke();
          ctx.restore();

          ctx.fillStyle = '#f8fafc';
          ctx.font = 'bold 10px system-ui';
          const label = ac.flight ? ac.flight.trim() : ac.hex;
          const altText = ac.alt_baro ? ` FL${Math.round(ac.alt_baro / 100)}` : '';
          ctx.fillText(`${label}${altText}`, pt.x + 10, pt.y + 4);
        });
      }

      requestAnimationFrame(drawRadarScope);
    }

    window.addEventListener('load', () => {
      canvas = document.getElementById('radarCanvas');
      ctx = canvas.getContext('2d');

      initKioskAudio();
      initMap();
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      
      requestAnimationFrame(drawRadarScope);
      fetchLiveFlights();
      setInterval(fetchLiveFlights, 12000);
    });
  </script>
</body>
</html>
