<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live ADSB Airspace Scope (Retro Radar Wall Board)</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg-color: #030704;
      --card-bg: rgba(5, 15, 9, 0.95);
      --card-border: #0f381f;
      --text-main: #00ff66;
      --text-dim: #2b7a4b;
      --accent-green: #00ff66;
      --accent-blue: #00bfff;
      --accent-military: #ffb000;
      --accent-red: #ff3333;
      --accent-amber-dim: #7a5a00;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      touch-action: none;
    }

    /* Red Pulsing Screen Overlay */
    #screen-pulse-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      pointer-events: none;
      background: rgba(255, 0, 0, 0);
      transition: background 0.3s ease;
    }

    .screen-pulse-active {
      animation: redPulse 1.5s ease-in-out 3;
    }

    @keyframes redPulse {
      0% { background: rgba(255, 0, 0, 0); box-shadow: inset 0 0 0px rgba(255,0,0,0); }
      50% { background: rgba(255, 0, 0, 0.22); box-shadow: inset 0 0 120px rgba(255,0,0,0.5); }
      100% { background: rgba(255, 0, 0, 0); box-shadow: inset 0 0 0px rgba(255,0,0,0); }
    }

    /* Tap-to-start overlay (needed to satisfy browser autoplay/audio-gesture requirements) */
    #start-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(1, 5, 2, 0.97);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      cursor: pointer;
      user-select: none;
    }
    #start-overlay.hidden { display: none; }
    #start-overlay .start-title {
      font-size: 1.1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent-green);
      text-shadow: 0 0 10px rgba(0,255,102,0.5);
    }
    #start-overlay .start-sub {
      font-size: 0.75rem;
      color: var(--text-dim);
    }
    #start-overlay .pulse-dot {
      width: 10px; height: 10px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 15px var(--accent-green); }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    main {
      flex: 1;
      padding: 0.3rem;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 0.3rem;
      width: 100%;
      min-height: 0;
    }

    .radar-wrapper {
      position: relative;
      background: #010502;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      overflow: hidden;
      height: 100%;
      width: 100%;
      touch-action: none;
      box-shadow: inset 0 0 30px rgba(0, 255, 102, 0.15);
    }

    #map {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      filter: brightness(1.15) contrast(1.05) saturate(1.1);
      opacity: 0.7;
      pointer-events: none;
      transition: clip-path 0.2s ease-out;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      height: 100%;
      z-index: 10;
      min-height: 0;
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
    }

    .panel-title {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--accent-military);
      margin-bottom: 0.35rem;
      letter-spacing: 0.05em;
      text-shadow: 0 0 6px rgba(255, 176, 0, 0.4);
    }

    .aircraft-grid {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      flex: 1;
      overflow-y: auto;
      padding-right: 2px;
      min-height: 0;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .aircraft-grid::-webkit-scrollbar {
      display: none;
    }

    .ac-card {
      background: rgba(10, 30, 18, 0.8);
      border: 1px solid var(--card-border);
      padding: 0.35rem 0.45rem;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .ac-thumb {
      width: 90px;
      height: 58px;
      background: rgba(2, 8, 4, 0.95);
      border: 1px solid var(--card-border);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .ac-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    footer {
      height: 110px;
      background: rgba(2, 10, 5, 0.98);
      border-top: 1px solid var(--card-border);
      padding: 0.3rem 0.4rem;
      display: flex;
      align-items: center;
      z-index: 1000;
      flex-shrink: 0;
    }

    .scrollboard {
      width: 100%;
      height: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
    }

    /* Sized by its own content: with a real photo, width follows the image's natural aspect
       ratio scaled to the full footer height (see .logo-container img) - "full size", not
       cropped to a fixed box like the old 105px column. min-width keeps it from collapsing
       to nothing in the text-fallback (no photo) state; max-width stops an unusually wide/
       panoramic photo from swallowing the metric columns next to it. The banner-col flex
       items (flex: 1 1 0, below) reflow to fill whatever space is left over automatically. */
    .logo-container {
      flex: 0 1 auto;
      height: 100%;
      min-width: 110px;
      max-width: 62%;
      background: rgba(2, 8, 4, 0.95);
      border-right: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .logo-container img {
      height: 100%;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      display: block;
    }

    .logo-fallback {
      font-size: 0.65rem;
      font-weight: bold;
      color: var(--accent-green);
      text-align: center;
      text-transform: uppercase;
      padding: 4px;
      text-shadow: 0 0 6px rgba(0, 255, 102, 0.5);
    }

    .banner-col {
      flex: 1 1 0;
      min-width: 0;
      padding: 0.3rem 0.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 100%;
      border-right: 1px solid rgba(15, 56, 31, 0.6);
    }

    /* The flight-info column's content (callsign, type, from/to) rarely needs a full equal
       third of the bar - giving it flex:1 1 0 like the metric columns left a dead gap between
       the text and the next box's border. Let it size to its own content instead (within
       sensible bounds) so the metric-group boxes shift left and sit right up against it. */
    .banner-col-info {
      flex: 0 1 auto;
      min-width: 260px;
      max-width: 50%;
    }

    .banner-col:last-child {
      border-right: none;
    }

    .airline-heading {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--accent-green);
      letter-spacing: 0.02em;
      line-height: 1.1;
      margin-bottom: 0.05rem;
      text-shadow: 0 0 8px rgba(0, 255, 102, 0.4);
    }

    .aircraft-meta {
      font-size: 0.7rem;
      color: var(--text-dim);
      font-weight: 500;
      margin-bottom: 0.1rem;
    }

    .route-container {
      display: flex;
      flex-direction: column;
      gap: 0.02rem;
      font-size: 0.72rem;
      font-weight: 600;
    }

    .route-row {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .route-label {
      color: var(--text-dim);
      font-size: 0.62rem;
      text-transform: uppercase;
      width: 26px;
      flex-shrink: 0;
    }

    .route-estimated .route-row span:not(.route-label) {
      color: var(--accent-amber-dim) !important;
    }

    .route-source-tag {
      font-size: 0.55rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.03rem 0.3rem;
      border-radius: 3px;
      margin-left: 0.3rem;
    }

    .route-source-tag.confirmed {
      color: var(--accent-green);
      border: 1px solid var(--accent-green);
    }

    .route-source-tag.estimated {
      color: var(--accent-military);
      border: 1px solid var(--accent-amber-dim);
    }

    .metric-group {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.02rem;
    }

    .primary-metric {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--accent-green);
      line-height: 1.1;
      text-shadow: 0 0 8px rgba(0, 255, 102, 0.5);
    }

    .secondary-metric {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .sub-title {
      font-size: 0.6rem;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <!-- Full Screen Red Pulse Overlay -->
  <div id="screen-pulse-overlay"></div>

  <!-- Tap-to-start overlay: browsers block AudioContext/SpeechSynthesis until a user gesture -->
  <div id="start-overlay">
    <div class="start-title"><span class="pulse-dot"></span>&nbsp; Retro ADSB Radar Scope</div>
    <div class="start-sub">Tap or click anywhere to start the feed and enable audio alerts</div>
  </div>

  <main>
    <div class="radar-wrapper" id="radarContainer">
      <div id="map"></div>
      <canvas id="radarCanvas"></canvas>
    </div>

    <aside class="sidebar">
      <div class="panel">
        <div class="panel-title">Active Military Transponders</div>
        <div id="aircraft-grid" class="aircraft-grid">
          <div style="color:var(--text-dim); font-size:0.75rem; padding: 0.5rem; text-align:center;">Scanning sector...</div>
        </div>
        <div id="status-bar" style="font-size:0.58rem; color:var(--text-dim); margin-top:0.3rem;">
          Station: 52.9529° N, 0.9547° W
        </div>
      </div>
    </aside>
  </main>

  <footer>
    <div class="scrollboard">
      <div class="logo-container" id="sb-logo-box">
        <span class="logo-fallback" id="sb-logo-text">--</span>
      </div>

      <div class="banner-col banner-col-info">
        <div id="sb-airline" class="airline-heading">AWAITING LOCK</div>
        <div id="sb-type" class="aircraft-meta">Type: --</div>
        <div class="route-container" id="sb-route-container">
          <div class="route-row">
            <span class="route-label">From</span>
            <span id="sb-from" style="color: var(--text-main);">--</span>
          </div>
          <div class="route-row">
            <span class="route-label">To</span>
            <span id="sb-to" style="color: var(--text-main);">--</span>
            <span id="sb-route-tag" class="route-source-tag" style="display:none;"></span>
          </div>
        </div>
      </div>

      <div class="banner-col metric-group">
        <div class="sub-title">Range & Kinematics</div>
        <div id="sb-distance" class="primary-metric">-- NM</div>
        <div id="sb-alt" class="secondary-metric">Alt: -- ft</div>
        <div id="sb-speed" class="secondary-metric">Spd: -- kts</div>
      </div>

      <div class="banner-col metric-group">
        <div class="sub-title">Vector & V/S</div>
        <div id="sb-rate" class="secondary-metric" style="font-weight: 700;">Rate: --</div>
        <div id="sb-heading" class="secondary-metric">Hdng: --°</div>
        <div id="sb-bearing" class="secondary-metric" style="font-size:0.72rem; color:var(--text-dim);">Bearing: --°</div>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"
          onerror="console.error('LEAFLET FAILED TO LOAD - CHECK NETWORK');"></script>

  <script>
    const userConfig = { lat: 52.9529, lon: -0.9547, radiusNM: 35 };
    let map = null;
    let canvas = null;
    let ctx = null;
    let liveAircraft = [];
    let lockedAircraft = null;
    let isFetching = false;
    let radarCircle = null;
    let pollBackoffUntil = 0;
    let consecutive429s = 0;
    const aircraftTrails = {};

    // Home-use kiosk: audio alerts are always on, no mute toggle.
    const audioAlertsEnabled = true;
    const pulsed35Hexes = new Set();
    const pulsed5Hexes = new Set();
    const announcedEmergencyHexes = new Set();
    let audioCtx = null;
    let feedStarted = false;

    // Debug/testing hook: a synthetic aircraft that gets merged into every poll's results
    // for a limited time, so the emergency-lock path (scrollboard override, red pulse, tone,
    // speech) can be exercised without waiting for a real squawk. See triggerTestSquawk().
    let testAircraft = null;
    let testAircraftExpiryAt = 0;

    // callsign -> {fromCode, toCode, fromName, toName, source: 'adsbdb'|'hexdb'|'estimated'},
    // or null once every source has been queried and confirmed there's no real data
    // (avoids re-querying every poll for callsigns nobody has data on)
    const routeCache = {};
    let adsbdbBackoffUntil = 0;
    let hexdbBackoffUntil = 0;

    // Simple in-memory photo cache so we don't re-fetch the same aircraft's photo every 12s poll
    const photoCache = {}; // key -> url string, or null for known-empty

    let scrollState = 'PAUSED_TOP';
    let scrollTimer = 120;
    let internalScrollPos = 0;

    // Array of randomized bonus phrases to prepend or add to speech alerts
    const randomAddonPhrases = [
      "hold on to your fucking hats boys! it could be a fast one.",
      "dont pull your willy too hard in excitement now!",
      "heads up troops, things are getting spicy!",
      "dont jizz too much in your pants but there is a",
      "shit's about to get real, we've got a",
      "hold my beer, im tracking a",
      "look alive dumbass, incoming",
      "no wanking on the job, we've got a",
      "put your pants back on! we've got a",
      "is it a bird? is it a plane? no well kind of, its a fucking",
      "well spank my ass and call me amy as there is a"
    ];

    function initKioskAudio() {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {}
    }

    // Runs on the first user gesture (tap/click on the start overlay). Browsers require a
    // real user gesture before AudioContext or SpeechSynthesis will produce sound, so nothing
    // in announceMilitaryAircraft() can reliably fire until this has run at least once.
    function startFeed() {
      if (feedStarted) return;
      feedStarted = true;

      initKioskAudio();
      if ('speechSynthesis' in window) {
        // Nudge speechSynthesis awake with a silent utterance, inside the gesture handler.
        const warmup = new SpeechSynthesisUtterance('');
        warmup.volume = 0;
        window.speechSynthesis.speak(warmup);
      }

      const overlay = document.getElementById('start-overlay');
      if (overlay) overlay.classList.add('hidden');

      canvas = document.getElementById('radarCanvas');
      ctx = canvas.getContext('2d');

      initMap();
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      requestAnimationFrame(drawRadarScope);
      fetchLiveFlights();
      setInterval(fetchLiveFlights, 12000);

      // Test-squawk via URL, e.g. radar.html?testsquawk=7700 - handy from mobile where
      // there's no keyboard for the shortcut below.
      const testParam = new URLSearchParams(window.location.search).get('testsquawk');
      if (testParam) triggerTestSquawk(testParam);
    }

    // Keyboard shortcut for testing the emergency-lock path at a desktop: 5/6/7 -> 7500/7600/7700.
    document.addEventListener('keydown', (e) => {
      if (!feedStarted) return;
      if (e.key === '5') triggerTestSquawk('7500');
      else if (e.key === '6') triggerTestSquawk('7600');
      else if (e.key === '7') triggerTestSquawk('7700');
    });


    const aircraftModelNames = {
      'C17': 'Boeing C-17 Globemaster',
      'C130': 'Lockheed C-130 Hercules',
      'F16': 'Lockheed Martin F-16 Fighting Falcon',
      'F15': 'McDonnell Douglas F-15 Eagle',
      'F18': 'Boeing F/A-18 Hornet',
      'F35': 'Lockheed Martin F-35 Lightning II',
      'EF20': 'Eurofighter Typhoon',
      'EUFI': 'Eurofighter Typhoon',
      'TYPH': 'Eurofighter Typhoon',
      'A400': 'Airbus A400M Atlas',
      'K35R': 'Boeing KC-135 Stratotanker',
      'KC135': 'Boeing KC-135 Stratotanker',
      'P8': 'Boeing P-8 Poseidon',
      'E3TF': 'Boeing E-3 Sentry AWACS',
      'CH47': 'Boeing CH-47 Chinook',
      'AH64': 'Boeing AH-64 Apache',
      'UH60': 'Sikorsky UH-60 Black Hawk',
      'V22': 'Bell Boeing V-22 Osprey',
      'HAWK': 'BAE Systems Hawk',
      'TOR': 'Panavia Tornado',
      'RC135': 'Boeing RC-135 Rivet Joint'
    };

    function playAlertTone() {
      if (!audioAlertsEnabled) return;
      try {
        if (!audioCtx) initKioskAudio();
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.15);
        
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } catch (e) {}
    }

    function triggerRedPulse() {
      const overlay = document.getElementById('screen-pulse-overlay');
      if (!overlay) return;
      overlay.classList.remove('screen-pulse-active');
      void overlay.offsetWidth; 
      overlay.classList.add('screen-pulse-active');
    }

    function getCardinalFromDeg(deg) {
      const val = Math.floor((deg + 22.5) / 45);
      const arr = ["North", "Northeast", "East", "Southeast", "South", "Southwest", "West", "Northwest"];
      return arr[(val % 8)];
    }

    const airportDatabase = {
      'EGLL': 'London Heathrow, UK',
      'EGKK': 'London Gatwick, UK',
      'EGGW': 'London Luton, UK',
      'EGSS': 'London Stansted, UK',
      'EGCC': 'Manchester Airport, UK',
      'EGBB': 'Birmingham Airport, UK',
      'EGNX': 'East Midlands Airport, UK',
      'EGPH': 'Edinburgh Airport, UK',
      'EGPF': 'Glasgow Airport, UK',
      'EGNT': 'Newcastle Airport, UK',
      'EGVN': 'RAF Brize Norton, UK',
      'EGUN': 'RAF Mildenhall, UK',
      'EGVA': 'RAF Fairford, UK',
      'EGXC': 'RAF Coningsby, UK',
      'EGUL': 'RAF Lakenheath, UK',
      'ETAR': 'Ramstein Air Base, Germany',
      'EHAM': 'Amsterdam Schiphol, Netherlands',
      'LFPG': 'Paris Charles de Gaulle, France',
      'EDDF': 'Frankfurt Airport, Germany',
      'EIDW': 'Dublin Airport, Ireland',
      'LEMD': 'Madrid Barajas, Spain',
      'LIRF': 'Rome Fiumicino, Italy',
      'KJFK': 'New York JFK, USA',
      'KLAX': 'Los Angeles International, USA',
      'OMDB': 'Dubai International, UAE'
    };

    // ---------------------------------------------------------------------
    // Route resolution: adsbdb.com -> hexdb.io -> local heuristic guess.
    // Only ever called for the single locked/nearest aircraft (see
    // fetchLiveFlights), never the whole liveAircraft list, so this stays
    // well within both services' free rate limits.
    // ---------------------------------------------------------------------

    async function queryAdsbdb(callsign) {
      if (Date.now() < adsbdbBackoffUntil) return undefined; // cooling off, try next poll
      try {
        const res = await fetch(`https://api.adsbdb.com/v0/callsign/${encodeURIComponent(callsign)}`);
        if (res.status === 429) {
          adsbdbBackoffUntil = Date.now() + 30000;
          return undefined;
        }
        if (!res.ok) return null; // 404 etc - confirmed no data from this source
        const data = await res.json();
        const route = data && data.response && data.response.flightroute;
        if (route && route.origin && route.destination) {
          const from = route.origin;
          const to = route.destination;
          return {
            fromCode: from.iata_code || from.icao_code,
            toCode: to.iata_code || to.icao_code,
            fromName: from.name + (from.municipality ? `, ${from.municipality}` : ''),
            toName: to.name + (to.municipality ? `, ${to.municipality}` : ''),
            source: 'adsbdb'
          };
        }
        return null;
      } catch (err) {
        return null;
      }
    }

    async function queryHexdb(callsign) {
      if (Date.now() < hexdbBackoffUntil) return undefined;
      try {
        const res = await fetch(`https://hexdb.io/api/v1/route/icao/${encodeURIComponent(callsign)}`);
        if (res.status === 429) {
          hexdbBackoffUntil = Date.now() + 30000;
          return undefined;
        }
        if (!res.ok) return null;
        const data = await res.json();
        // hexdb returns {"orig_icao":"EGLL","orig_iata":"LHR",...,"dest_icao":"LEBL","dest_iata":"BCN",...}
        // treat a missing/empty pair as "no data" rather than a false-positive route.
        if (data && (data.orig_iata || data.orig_icao) && (data.dest_iata || data.dest_icao)) {
          return {
            fromCode: data.orig_iata || data.orig_icao,
            toCode: data.dest_iata || data.dest_icao,
            fromName: data.orig_icao ? (airportDatabase[data.orig_icao] || '') : '',
            toName: data.dest_icao ? (airportDatabase[data.dest_icao] || '') : '',
            source: 'hexdb'
          };
        }
        return null;
      } catch (err) {
        return null;
      }
    }

    // Fetches a real route for the single locked/nearest aircraft, trying adsbdb first
    // and hexdb.io second. Caches whatever the outcome is (a route, or a confirmed "null")
    // so we don't re-query every poll for a callsign both sources don't have.
    async function fetchRoutesForAircraft(acList) {
      const ac = acList[0];
      if (!ac) return;
      const callsign = (ac.flight || '').trim().toUpperCase();
      if (!callsign) return;
      if (routeCache[callsign] !== undefined) return; // already resolved (real or confirmed-empty)

      // Both adsbdb and hexdb only accept plain ICAO-style callsigns: letters/digits, no
      // spaces or dashes. Tactical callsigns ("LEADER 4"), bare registrations ("G-VBZZ"),
      // and short fragments ("C4", "P2") always fail - skip the network round-trips.
      if (!/^[A-Z0-9]{3,8}$/.test(callsign)) {
        routeCache[callsign] = null;
        return;
      }

      let result = await queryAdsbdb(callsign);
      if (result === undefined) return; // rate-limited, leave unresolved and retry next poll
      if (!result) {
        result = await queryHexdb(callsign);
        if (result === undefined) return;
      }

      routeCache[callsign] = result || null; // null = confirmed no data from either source
    }

    function resolveFlightRoute(flightStr, ac) {
      if (ac.orig && ac.dest) {
        return { fromCode: ac.orig.toUpperCase(), toCode: ac.dest.toUpperCase(), source: 'adsb-payload' };
      }
      if (ac.from && ac.to) {
        return { fromCode: ac.from.toUpperCase(), toCode: ac.to.toUpperCase(), source: 'adsb-payload' };
      }

      const callsign = (flightStr || '').toUpperCase().trim();

      // Real route data from adsbdb/hexdb, if we resolved it for this callsign.
      const cached = routeCache[callsign];
      if (cached) return cached;

      // Nothing confirmed from either source - fall through to a heuristic guess.
      // This is clearly NOT real routing data, just a plausible-looking placeholder based
      // on callsign prefix or current heading. Callers must label this distinctly (see
      // updateNearestScrollboard) rather than rendering it identically to a confirmed route.
      const heading = ac.track !== undefined ? ac.track : 0;

      const guess = (() => {
        if (isMilitary(ac)) {
          if (callsign.startsWith('RRR') || callsign.startsWith('ASCOT')) {
            return { fromCode: 'EGVN', toCode: 'EGUN' };
          } else if (callsign.startsWith('SHF') || callsign.startsWith('VORTEX')) {
            return { fromCode: 'EGXC', toCode: 'EGVN' };
          } else if (callsign.startsWith('RCH') || callsign.startsWith('REACH') || callsign.startsWith('DUKE')) {
            return { fromCode: 'ETAR', toCode: 'EGUN' };
          } else if (callsign.startsWith('BOOM') || callsign.startsWith('ASY')) {
            return { fromCode: 'EGVA', toCode: 'EGVN' };
          }
          return { fromCode: 'EGVN', toCode: 'EGXC' };
        }

        if (callsign.startsWith('RYR')) {
          return { fromCode: 'EGNX', toCode: 'EHAM' };
        } else if (callsign.startsWith('EXS') || callsign.startsWith('LS')) {
          return { fromCode: 'EGNX', toCode: 'LEMD' };
        } else if (callsign.startsWith('EZY') || callsign.startsWith('U2')) {
          return { fromCode: 'EGCC', toCode: 'LFPG' };
        } else if (callsign.startsWith('BAW') || callsign.startsWith('SHT')) {
          return { fromCode: 'EGLL', toCode: 'KJFK' };
        } else if (callsign.startsWith('KLM')) {
          return { fromCode: 'EHAM', toCode: 'EGBB' };
        } else if (callsign.startsWith('DLH')) {
          return { fromCode: 'EDDF', toCode: 'EGLL' };
        }

        if (heading >= 315 || heading < 45) {
          return { fromCode: 'EGNX', toCode: 'EGPH' };
        } else if (heading >= 45 && heading < 135) {
          return { fromCode: 'EGCC', toCode: 'EHAM' };
        } else if (heading >= 135 && heading < 225) {
          return { fromCode: 'EGPH', toCode: 'EGLL' };
        } else {
          return { fromCode: 'EHAM', toCode: 'EIDW' };
        }
      })();

      guess.source = 'estimated';
      return guess;
    }

    function announceMilitaryAircraft(ac) {
      if (!audioAlertsEnabled) return;

      const dist = calcDistanceNM(userConfig.lat, userConfig.lon, ac.lat, ac.lon);
      let triggeredPulse = false;

      if (dist <= 5.0 && !pulsed5Hexes.has(ac.hex)) {
        pulsed5Hexes.add(ac.hex);
        pulsed35Hexes.add(ac.hex);
        triggeredPulse = true;
        playAlertTone();
        triggerRedPulse();

        setTimeout(() => {
          if (!audioAlertsEnabled) return;
          const callsign = ac.flight ? ac.flight.trim() : 'Unknown callsign';
          const bearing = calcBearing(userConfig.lat, userConfig.lon, ac.lat, ac.lon);
          const posCardinal = getCardinalFromDeg(bearing);
          const trackCardinal = getCardinalFromDeg(ac.track !== undefined ? ac.track : 0);
          const altText = ac.alt_baro ? `${Math.round(ac.alt_baro)} feet` : 'ground level';
          
          const speedKts = ac.gs !== undefined ? Math.round(ac.gs) : 0;
          const speedMph = Math.round(speedKts * 1.15078);
          
          // Randomly select one of the phrases from the array to add on top
          const randomPhrase = randomAddonPhrases[Math.floor(Math.random() * randomAddonPhrases.length)];

          const speechText = `${randomPhrase} Proximity alert. Military aircraft callsign ${callsign} is heading in from the ${posCardinal} and moving ${trackCardinal} at ${altText} altitude, travelling at ${speedKts} knots, or ${speedMph} miles per hour, ${dist.toFixed(1)} miles away.`;
          
          if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(speechText);
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            window.speechSynthesis.speak(utterance);
          }
        }, 350);
      }

      if (!triggeredPulse && dist <= 35.0 && !pulsed35Hexes.has(ac.hex)) {
        pulsed35Hexes.add(ac.hex);
        playAlertTone();
        triggerRedPulse();
      }
    }

    function calcDistanceNM(lat1, lon1, lat2, lon2) {
      const R = 3440.065;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function calcBearing(lat1, lon1, lat2, lon2) {
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
      const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
                Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLon);
      let brng = Math.atan2(y, x) * 180 / Math.PI;
      return Math.round((brng + 360) % 360);
    }

    const EMERGENCY_SQUAWKS = ['7500', '7600', '7700'];
    const EMERGENCY_LOCK_RADIUS_NM = 250;

    function isEmergencySquawk(ac) {
      return EMERGENCY_SQUAWKS.includes(ac.squawk);
    }

    // ---------------------------------------------------------------------
    // Test-squawk injector: for exercising the emergency-lock path (scrollboard override,
    // red pulse, tone, speech) without waiting for a real 7500/7600/7700. Trigger via:
    //   - browser console: triggerTestSquawk('7700')
    //   - URL param on load: radar.html?testsquawk=7700
    //   - keyboard: press 5 / 6 / 7 once the feed has started
    // The fake aircraft is merged into liveAircraft on every poll for TEST_AIRCRAFT_TTL_MS,
    // then expires on its own - no cleanup step needed.
    // ---------------------------------------------------------------------
    const TEST_AIRCRAFT_TTL_MS = 90000;

    function buildTestAircraft(squawk) {
      const bearingRad = Math.random() * 2 * Math.PI;
      const distNM = 3 + Math.random() * 8; // a few NM out, well inside the 35 NM scope
      const dLat = (distNM / 60) * Math.cos(bearingRad);
      const dLon = (distNM / 60) * Math.sin(bearingRad) / Math.cos(userConfig.lat * Math.PI / 180);
      return {
        // Random suffix so announcedEmergencyHexes/pulsed sets don't swallow repeat tests.
        hex: 'TEST' + Math.floor(Math.random() * 9000 + 1000),
        flight: 'TESTSQK ',
        lat: userConfig.lat + dLat,
        lon: userConfig.lon + dLon,
        alt_baro: 12000,
        gs: 280,
        track: Math.floor(Math.random() * 360),
        squawk: squawk,
        t: 'B738',
        category: 'A3'
      };
    }

    function triggerTestSquawk(squawk) {
      squawk = String(squawk || '7700');
      if (!EMERGENCY_SQUAWKS.includes(squawk)) {
        console.warn(`[TEST] "${squawk}" isn't 7500/7600/7700 - defaulting to 7700`);
        squawk = '7700';
      }
      testAircraft = buildTestAircraft(squawk);
      testAircraftExpiryAt = Date.now() + TEST_AIRCRAFT_TTL_MS;
      console.log(`[TEST] Injecting fake squawk ${squawk} aircraft (${testAircraft.hex}) for ${TEST_AIRCRAFT_TTL_MS / 1000}s`);

      // Apply immediately rather than waiting for the next 12s poll.
      liveAircraft = liveAircraft.filter(a => !a.hex || !a.hex.startsWith('TEST')).concat([testAircraft]);
      updateUIState(true);
    }
    window.triggerTestSquawk = triggerTestSquawk;

    // The only place a route (From/To) is ever displayed is the scrollboard, locked onto
    // whichever aircraft is selected below. Route lookups should only ever target that one
    // aircraft - never the whole liveAircraft list, or we flood adsbdb/hexdb with lookups
    // nobody sees.
    function findNearestAircraft(acList) {
      const validAc = (acList || []).filter(a => a.lat && a.lon);
      if (validAc.length === 0) return null;
      return [...validAc].sort((a, b) =>
        calcDistanceNM(userConfig.lat, userConfig.lon, a.lat, a.lon) -
        calcDistanceNM(userConfig.lat, userConfig.lon, b.lat, b.lon)
      )[0];
    }

    // Squawking 7500 (hijack), 7600 (radio failure), or 7700 (general emergency) takes
    // priority for the scrollboard lock over plain proximity: if any such aircraft is within
    // EMERGENCY_LOCK_RADIUS_NM, it's shown instead of whichever aircraft is nearest. With
    // multiple simultaneous emergencies, the closest one wins. Falls back to nearest-aircraft
    // when there's no emergency in range.
    function findScrollboardTarget(acList) {
      const validAc = (acList || []).filter(a => a.lat && a.lon);
      if (validAc.length === 0) return null;

      const emergencyAc = validAc.filter(a =>
        isEmergencySquawk(a) &&
        calcDistanceNM(userConfig.lat, userConfig.lon, a.lat, a.lon) <= EMERGENCY_LOCK_RADIUS_NM
      );

      if (emergencyAc.length > 0) {
        return [...emergencyAc].sort((a, b) =>
          calcDistanceNM(userConfig.lat, userConfig.lon, a.lat, a.lon) -
          calcDistanceNM(userConfig.lat, userConfig.lon, b.lat, b.lon)
        )[0];
      }

      return findNearestAircraft(validAc);
    }

    // Shared photo lookup with a simple cache, used by both the scrollboard and the
    // sidebar cards so a photo already fetched this session isn't re-requested every poll.
    async function resolveAircraftPhoto(ac) {
      const cacheKey = (ac.r && ac.r.trim()) || (ac.t && ac.t.trim()) || ac.hex;
      if (cacheKey && photoCache[cacheKey] !== undefined) {
        return photoCache[cacheKey];
      }

      let photoUrl = null;

      if (ac.r && ac.r.trim() !== '') {
        try {
          const res = await fetch(`https://api.planespotters.net/pub/photos/reg/${encodeURIComponent(ac.r.trim())}`);
          if (res.ok) {
            const data = await res.json();
            if (data.photos && data.photos.length > 0) {
              photoUrl = data.photos[0].thumbnail_large.src;
            }
          }
        } catch (err) {}
      }

      if (!photoUrl && ac.t && ac.t.trim() !== '') {
        try {
          const res = await fetch(`https://api.planespotters.net/pub/photos/icaotype/${encodeURIComponent(ac.t.trim())}`);
          if (res.ok) {
            const data = await res.json();
            if (data.photos && data.photos.length > 0) {
              photoUrl = data.photos[0].thumbnail_large.src;
            }
          }
        } catch (err) {}
      }

      if (cacheKey) photoCache[cacheKey] = photoUrl;
      return photoUrl;
    }

    async function fetchAircraftPhoto(ac, isMil) {
      const logoBox = document.getElementById('sb-logo-box');
      if (isMil) {
        logoBox.innerHTML = `<span class="logo-fallback" style="color: var(--accent-military);">MILITARY</span>`;
      } else {
        logoBox.innerHTML = `<span class="logo-fallback" id="sb-logo-text">--</span>`;
      }

      const photoUrl = await resolveAircraftPhoto(ac);

      if (photoUrl) {
        logoBox.innerHTML = `<img src="${photoUrl}" alt="Aircraft Photo">`;
      } else if (isMil) {
        logoBox.innerHTML = `<span class="logo-fallback" style="color: var(--accent-military);">MIL AC</span>`;
      } else {
        logoBox.innerHTML = `<span class="logo-fallback">${ac.t || 'CIVIL'}</span>`;
      }
    }

    async function fetchCardPhoto(ac, thumbId) {
      const thumbEl = document.getElementById(thumbId);
      if (!thumbEl) return;

      const photoUrl = await resolveAircraftPhoto(ac);

      // The card (and its id) may have been re-rendered away while the fetch was in flight
      // (e.g. next poll cycle) - re-grab it rather than trust the closed-over reference.
      const liveEl = document.getElementById(thumbId);
      if (!liveEl) return;

      if (photoUrl) {
        liveEl.innerHTML = `<img src="${photoUrl}" alt="Military Aircraft Photo">`;
      } else {
        liveEl.innerHTML = `<span style="font-size:0.55rem; color:var(--accent-military); font-weight:bold; text-align:center;">MIL</span>`;
      }
    }

    function initMap() {
      map = L.map('map', {
        zoomControl: false,
        attributionControl: false,
        dragging: false,
        scrollWheelZoom: false,
        doubleClickZoom: false,
        boxZoom: false,
        keyboard: false,
        touchZoom: false,
        tap: false
      }).setView([userConfig.lat, userConfig.lon], 10);

      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      const radiusMeters = userConfig.radiusNM * 1852;
      radarCircle = L.circle([userConfig.lat, userConfig.lon], {
        color: '#00ff66',
        weight: 2,
        opacity: 0.8,
        fillColor: '#00ff66',
        fillOpacity: 0.05,
        radius: radiusMeters
      }).addTo(map);

      map.fitBounds(radarCircle.getBounds(), { padding: [10, 10] });
    }

    function resizeCanvas() {
      if (!canvas) return;
      const container = document.getElementById('radarContainer');
      const rect = container.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      
      if (map && radarCircle) {
        map.invalidateSize();
        map.fitBounds(radarCircle.getBounds(), { padding: [10, 10] });
      }
    }

    async function fetchLiveFlights() {
      if (isFetching) return;

      if (Date.now() < pollBackoffUntil) {
        return;
      }

      isFetching = true;

      // airplanes.live's public /v2/point/ endpoint now requires a feeder-linked API key
      // (returns 403 for unauthenticated requests) - dropped as a fallback.
      const endpoints = [
        `https://api.adsb.lol/v2/point/${userConfig.lat}/${userConfig.lon}/${userConfig.radiusNM}`
      ];
      let success = false;
      let sawRateLimit = false;

      for (let url of endpoints) {
        try {
          const response = await fetch(url, { headers: { 'Accept': 'application/json' } });
          if (response.status === 429) {
            sawRateLimit = true;
            continue;
          }
          if (response.ok) {
            const data = await response.json();
            const aircrafts = data.ac || data.aircraft;
            if (aircrafts) {
              // Some feeds inject a synthetic "ground station" placeholder - hex all zeros,
              // type "TWR" - representing the receiver's own site rather than an aircraft.
              // Drop these before anything else, or they can end up "nearest" (distance ~0)
              // and lock the scrollboard onto a fake target.
              liveAircraft = aircrafts.filter(ac => !/^0+$/.test(ac.hex || '') && (ac.t || '').toUpperCase() !== 'TWR');

              // Keep the injected test-squawk aircraft (see triggerTestSquawk) alive across
              // polls until it expires, so a real fetch cycle doesn't wipe it out mid-test.
              if (testAircraft) {
                if (Date.now() < testAircraftExpiryAt) {
                  liveAircraft = liveAircraft.concat([testAircraft]);
                } else {
                  testAircraft = null;
                }
              }

              liveAircraft.forEach(ac => {
                if (!ac.hex || !ac.lat || !ac.lon) return;
                if (!aircraftTrails[ac.hex]) aircraftTrails[ac.hex] = [];
                const t = aircraftTrails[ac.hex];
                const last = t[t.length - 1];
                if (!last || Math.abs(last.lat - ac.lat) > 0.0005 || Math.abs(last.lon - ac.lon) > 0.0005) {
                  t.push({ lat: ac.lat, lon: ac.lon });
                  if (t.length > 20) t.shift();
                }
              });

              // Route lookups only matter for whichever aircraft the scrollboard is locked
              // onto (an in-range emergency squawk, or otherwise the nearest aircraft) -
              // resolving the whole liveAircraft list every poll needlessly floods adsbdb/hexdb.
              const scrollboardTarget = findScrollboardTarget(liveAircraft);
              if (scrollboardTarget) await fetchRoutesForAircraft([scrollboardTarget]);

              updateUIState(true);
              success = true;
              break;
            }
          }
        } catch (err) {}
      }

      if (success) {
        consecutive429s = 0;
        pollBackoffUntil = 0;
      } else if (sawRateLimit) {
        consecutive429s++;
        // 15s, 30s, 60s, 120s, ... capped at 5 minutes
        const backoffMs = Math.min(300000, 15000 * Math.pow(2, consecutive429s - 1));
        pollBackoffUntil = Date.now() + backoffMs;
      } else {
        updateUIState(false);
      }
      isFetching = false;
    }

    function updateUIState(isConnected) {
      if (isConnected) {
        renderFlightBoard(liveAircraft);
        updateNearestScrollboard(liveAircraft);
      }
    }

    function isMilitary(ac) {
      const type = (ac.t || '').toUpperCase();
      const flight = (ac.flight || '').toUpperCase();
      const reg = (ac.r || '').toUpperCase();
      const cat = (ac.category || '').toUpperCase();

      // ADS-B emitter categories B0-B7 and C0-C3 cover non-aircraft: surface vehicles and
      // fixed "point obstacle" beacons (commonly mounted on masts/towers, including at
      // airports, for obstruction marking). These sometimes carry a government/military
      // database flag - which previously tripped the dbFlags check below and got a fixed
      // ground beacon rendered as a "military transponder". Exclude them outright first,
      // since they're never aircraft regardless of any other flag.
      if (/^[BC][0-7]$/.test(cat)) return false;

      if (reg.startsWith('G-')) return false;

      const civilExclusions = [
        'MM16', 'B407', 'R22', 'R44', 'AS35', 'EC35', 'EC45', 'H125', 'H135', 
        'B206', 'C172', 'PA28', 'SR20', 'SR22', 'C152', 'DA40', 'DA42', 'AS50'
      ];
      if (civilExclusions.some(ex => type.includes(ex))) return false;

      const milTypes = [
        'F16', 'F15', 'F18', 'F35', 'F22', 'EF20', 'EUFI', 'TYPH', 'TOR', 
        'HAWK', 'A10', 'C130', 'C17', 'A400', 'K35R', 'E3TF', 'V22', 'CH47', 
        'AH64', 'UH60', 'NH90', 'P8', 'RC135', 'KC135'
      ];
      if (milTypes.some(s => {
        if (s === 'C17') return type === 'C17' || type === 'C-17';
        return type.includes(s);
      })) return true;

      const milPrefixes = ['RRR', 'ASCOT', 'SHF', 'VORTEX', 'RCH', 'DUKE', 'BOOM', 'REACH', 'CNV', 'GUN', 'VIPER'];
      if (milPrefixes.some(prefix => flight.startsWith(prefix))) return true;

      const dbFlags = ac.dbFlags !== undefined ? ac.dbFlags : (ac.db_flags !== undefined ? ac.db_flags : 0);
      if (dbFlags & 1) {
        if (reg.startsWith('G-') || reg.startsWith('N')) return false;
        return true;
      }

      if (cat === 'A7') return true;

      return false;
    }

    function renderFlightBoard(acList) {
      const gridEl = document.getElementById('aircraft-grid');
      if (!gridEl) return;

      const currentScroll = gridEl.scrollTop;
      gridEl.innerHTML = '';

      const militaryList = acList.filter(ac => isMilitary(ac));

      if (!militaryList || militaryList.length === 0) {
        gridEl.innerHTML = '<div style="color:var(--text-dim); font-size:0.75rem; padding: 0.5rem; text-align:center;">No active military transponders within 35 NM.</div>';
        internalScrollPos = 0;
        return;
      }

      militaryList.forEach((ac, index) => {
        if (!ac.lat || !ac.lon) return;

        announceMilitaryAircraft(ac);

        const dist = calcDistanceNM(userConfig.lat, userConfig.lon, ac.lat, ac.lon);
        const cardId = `mil-card-${ac.hex}-${index}`;
        const card = document.createElement('div');
        card.className = 'ac-card';
        card.innerHTML = `
          <div class="ac-thumb" id="${cardId}-thumb">
            <span style="font-size:0.55rem; color:var(--accent-military); font-weight:bold; text-align:center;">MIL</span>
          </div>
          <div style="flex: 1; min-width: 0;">
            <div style="font-weight:bold; font-size:0.78rem; color:var(--accent-military); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 0 5px rgba(255,176,0,0.4);">${ac.flight ? ac.flight.trim() : ac.hex}</div>
            <div style="font-size:0.65rem; color:var(--text-dim);">[${ac.t || 'MIL'}] • ${ac.gs || 0} kts</div>
          </div>
          <div style="text-align:right; flex-shrink: 0;">
            <div style="font-weight:bold; color:var(--accent-green); font-size:0.78rem; text-shadow: 0 0 5px rgba(0,255,102,0.4);">${dist.toFixed(1)} NM</div>
            <div style="font-size:0.65rem; color:var(--text-dim);">${ac.alt_baro || 'Ground'} ft</div>
          </div>
        `;
        gridEl.appendChild(card);
        fetchCardPhoto(ac, `${cardId}-thumb`);
      });

      gridEl.scrollTop = Math.min(currentScroll, gridEl.scrollHeight - gridEl.clientHeight);
      internalScrollPos = gridEl.scrollTop;
    }

    function processAutoScroll() {
      const grid = document.getElementById('aircraft-grid');
      if (!grid) return;

      const maxScroll = grid.scrollHeight - grid.clientHeight;

      if (maxScroll <= 0) {
        internalScrollPos = 0;
        grid.scrollTop = 0;
        return;
      }

      if (scrollState === 'PAUSED_TOP') {
        scrollTimer--;
        if (scrollTimer <= 0) {
          scrollState = 'SCROLLING';
        }
        return;
      }

      if (scrollState === 'PAUSED_BOTTOM') {
        scrollTimer--;
        if (scrollTimer <= 0) {
          internalScrollPos = 0;
          grid.scrollTop = 0;
          scrollState = 'PAUSED_TOP';
          scrollTimer = 120;
        }
        return;
      }

      internalScrollPos += 0.35;
      grid.scrollTop = internalScrollPos;

      if (grid.scrollTop >= maxScroll - 1 || internalScrollPos >= maxScroll) {
        scrollState = 'PAUSED_BOTTOM';
        scrollTimer = 120;
        internalScrollPos = maxScroll;
        grid.scrollTop = maxScroll;
      }
    }

    function updateNearestScrollboard(acList) {
      if (!acList || acList.length === 0) return;
      lockedAircraft = findScrollboardTarget(acList);
      if (!lockedAircraft) return;

      const dist = calcDistanceNM(userConfig.lat, userConfig.lon, lockedAircraft.lat, lockedAircraft.lon);
      const bearing = calcBearing(userConfig.lat, userConfig.lon, lockedAircraft.lat, lockedAircraft.lon);
      const flightStr = lockedAircraft.flight ? lockedAircraft.flight.trim() : `ICAO: ${lockedAircraft.hex}`;
      const isEmergencyLock = isEmergencySquawk(lockedAircraft);

      // Sound/flash once per aircraft the first time it takes an emergency lock, not on
      // every 12s poll while it's still squawking - otherwise this fires continuously for
      // as long as the emergency lasts.
      if (isEmergencyLock && !announcedEmergencyHexes.has(lockedAircraft.hex)) {
        announcedEmergencyHexes.add(lockedAircraft.hex);
        playAlertTone();
        triggerRedPulse();
      }

      fetchAircraftPhoto(lockedAircraft, isMilitary(lockedAircraft));

      const speedKts = lockedAircraft.gs !== undefined ? Math.round(lockedAircraft.gs) : 0;
      const speedMph = Math.round(speedKts * 1.15078);

      document.getElementById('sb-distance').innerText = `${dist.toFixed(1)} NM`;
      document.getElementById('sb-alt').innerText = `Alt: ${lockedAircraft.alt_baro || 'Ground'} ft`;
      document.getElementById('sb-speed').innerText = `Spd: ${speedKts} kts (${speedMph} mph)`;

      const airlineEl = document.getElementById('sb-airline');
      airlineEl.innerText = isEmergencyLock ? `⚠ EMERGENCY — ${flightStr}` : flightStr;
      airlineEl.style.color = isEmergencyLock ? 'var(--accent-red)' : 'var(--accent-green)';
      airlineEl.style.textShadow = isEmergencyLock
        ? '0 0 10px rgba(255,51,51,0.6)'
        : '0 0 8px rgba(0,255,102,0.4)';

      document.getElementById('sb-type').innerText = `Type: ${lockedAircraft.t || 'Aircraft'}`;

      const heading = lockedAircraft.track !== undefined ? Math.round(lockedAircraft.track) : '--';
      document.getElementById('sb-heading').innerText = `Hdng: ${heading}°`;
      document.getElementById('sb-bearing').innerText = `Bearing: ${bearing}°`;

      const vertRate = lockedAircraft.baro_rate !== undefined ? lockedAircraft.baro_rate : 0;
      const rateEl = document.getElementById('sb-rate');
      if (vertRate > 30) {
        rateEl.innerHTML = `<span style="color: var(--accent-green); text-shadow: 0 0 6px rgba(0,255,102,0.4);">▲ +${vertRate} ft/m</span>`;
      } else if (vertRate < -30) {
        rateEl.innerHTML = `<span style="color: var(--accent-red); text-shadow: 0 0 6px rgba(255,51,51,0.4);">▼ ${vertRate} ft/m</span>`;
      } else {
        rateEl.innerHTML = `<span style="color: var(--text-dim);">— Level Flight</span>`;
      }

      // Route: real data (adsbdb/hexdb) is shown in the normal green; when nothing real was
      // found and we fall back to the heuristic guess, the container is flagged as
      // "estimated" (dimmer amber text + a tag) so it's never visually indistinguishable
      // from a confirmed route.
      const route = resolveFlightRoute(flightStr, lockedAircraft);
      const isEstimated = route.source === 'estimated';

      const routeContainer = document.getElementById('sb-route-container');
      routeContainer.classList.toggle('route-estimated', isEstimated);

      document.getElementById('sb-from').innerHTML =
        `<b>${route.fromCode}</b> — <span style="color:var(--text-dim);">${route.fromName || airportDatabase[route.fromCode] || 'Aerodrome'}</span>`;
      document.getElementById('sb-to').innerHTML =
        `<b>${route.toCode}</b> — <span style="color:var(--text-dim);">${route.toName || airportDatabase[route.toCode] || 'Aerodrome'}</span>`;

      const tagEl = document.getElementById('sb-route-tag');
      tagEl.style.display = 'inline-block';
      if (isEstimated) {
        tagEl.className = 'route-source-tag estimated';
        tagEl.innerText = 'EST';
        tagEl.title = 'No confirmed route data - estimated from callsign/heading';
      } else {
        tagEl.className = 'route-source-tag confirmed';
        tagEl.innerText = route.source === 'hexdb' ? 'HEXDB' : 'CONFIRMED';
        tagEl.title = `Route data from ${route.source}`;
      }
    }

    // Finer-grained classification, closer to what ADS-B Exchange / tar1090 does: rather than
    // lumping everything non-military into one "airliner" glyph, split by airframe class so the
    // scope reads at a glance (widebody vs narrowbody vs regional jet vs turboprop vs GA single
    // vs biz jet vs glider), in addition to the existing fighter/heavy-mil/helicopter buckets.
    function getSilhouetteType(typeCode, category) {
      const t = (typeCode || '').toUpperCase();
      const cat = (category || '').toUpperCase();

      if (['F16', 'F15', 'F18', 'F35', 'F22', 'EF20', 'EUFI', 'TYPH', 'TOR', 'HAWK', 'A10'].some(s => t.includes(s))) return 'fighter';

      if (['CH47', 'AH64', 'UH60', 'V22', 'EC35', 'EC45', 'AS35', 'AS50', 'R22', 'R44', 'B407', 'B206', 'H125', 'H135', 'NH90'].some(s => t.includes(s))) return 'helicopter';
      if (cat === 'A7') return 'helicopter';

      // Military heavies (transports/tankers/AWACS) and civil widebodies both read as "heavy"
      // on scope - big fuselage, four-abreast wing swept further back, wider tail.
      const heavyTypes = [
        'C17', 'C130', 'A400', 'K35R', 'KC135', 'KC10', 'KC46', 'E3TF', 'E3', 'P8', 'RC135', 'C5',
        'B742', 'B743', 'B744', 'B748', 'A388', // 747 / A380
        'B772', 'B773', 'B77L', 'B77W', 'B788', 'B789', 'B78X', // 777 / 787
        'A332', 'A333', 'A338', 'A339', 'A342', 'A343', 'A345', 'A346', 'A359', 'A35K', // A330/340/350
        'MD11', 'IL76', 'IL96'
      ];
      if (heavyTypes.some(s => (s === 'C17' ? (t === 'C17' || t === 'C-17') : t.includes(s)))) return 'heavy';

      // Regional jets - smaller swept-wing twins, shorter fuselage than a narrowbody airliner.
      const regionalTypes = ['CRJ1', 'CRJ2', 'CRJ7', 'CRJ9', 'CRJX', 'E135', 'E145', 'E170', 'E175', 'E190', 'E195', 'ERJ1', 'ERJ4', 'SU95', 'F70', 'F100'];
      if (regionalTypes.some(s => t.includes(s))) return 'regional';

      // Business jets - small sleek jets, short/straight-ish wings, no widebody presence.
      const bizjetTypes = ['C25A', 'C25B', 'C25C', 'C550', 'C56X', 'C680', 'C700', 'C750', 'GLF4', 'GLF5', 'GLF6', 'GLEX', 'CL30', 'CL35', 'FA7X', 'FA8X', 'F900', 'LJ35', 'LJ45', 'LJ60', 'E50P', 'E55P', 'E545', 'E550', 'H25B', 'PRM1'];
      if (bizjetTypes.some(s => t.includes(s))) return 'bizjet';

      // Twin turboprops - straight wings, visible engine nacelles, stubbier fuselage.
      const turbopropTypes = ['AT43', 'AT45', 'AT72', 'AT75', 'AT76', 'DH8A', 'DH8B', 'DH8C', 'DH8D', 'SF34', 'B350', 'BE20', 'BE30', 'BE9L', 'JS41', 'JS32', 'SW4', 'D328', 'DHC6', 'MU2', 'F27', 'F50'];
      if (turbopropTypes.some(s => t.includes(s))) return 'turboprop';

      // Single-engine GA / light singles (incl. single-turboprop like PC12/TBM/C208).
      const singlepropTypes = ['C172', 'C152', 'C182', 'C206', 'PA28', 'PA34', 'PA46', 'SR20', 'SR22', 'DA40', 'DA42', 'DA62', 'M20P', 'M20T', 'BE36', 'BE33', 'PC12', 'TBM8', 'TBM9', 'C208', 'GA8'];
      if (singlepropTypes.some(s => t.includes(s))) return 'singleprop';

      const gliderTypes = ['GLID', 'ASK21', 'ASW', 'DG40', 'DG80', 'LS8', 'LS6', 'VENT'];
      if (gliderTypes.some(s => t.includes(s))) return 'glider';

      // Everything else defaults to narrowbody jet (737/A320-family territory) - the most
      // common shape in normal airspace, and a sane fallback when the type code is unknown.
      return 'airliner';
    }

    function drawAircraftSilhouettePath(ctx, type) {
      ctx.beginPath();
      if (type === 'fighter') {
        ctx.moveTo(0, -6);
        ctx.lineTo(1.5, -1.5);
        ctx.lineTo(4, 3);
        ctx.lineTo(1, 2);
        ctx.lineTo(1.5, 5);
        ctx.lineTo(0, 4);
        ctx.lineTo(-1.5, 5);
        ctx.lineTo(-1, 2);
        ctx.lineTo(-4, 3);
        ctx.lineTo(-1.5, -1.5);
      } else if (type === 'heavy') {
        ctx.moveTo(0, -6);
        ctx.lineTo(2, -2);
        ctx.lineTo(5.5, 1);
        ctx.lineTo(5.5, 2.5);
        ctx.lineTo(1.5, 1.5);
        ctx.lineTo(2, 5.5);
        ctx.lineTo(0, 4);
        ctx.lineTo(-2, 5.5);
        ctx.lineTo(-1.5, 1.5);
        ctx.lineTo(-5.5, 2.5);
        ctx.lineTo(-5.5, 1);
        ctx.lineTo(-2, -2);
      } else if (type === 'helicopter') {
        ctx.arc(0, 0, 3, 0, 2 * Math.PI);
        ctx.moveTo(0, 3);
        ctx.lineTo(0, 6);
      } else if (type === 'regional') {
        // Same swept-wing family as the narrowbody shape, scaled down (shorter fuselage,
        // shorter wingspan) so it reads visibly smaller on scope next to an airliner.
        ctx.moveTo(0, -5);
        ctx.lineTo(1, -2);
        ctx.lineTo(3.6, 0.5);
        ctx.lineTo(3.6, 1.6);
        ctx.lineTo(1, 0.8);
        ctx.lineTo(1.2, 4);
        ctx.lineTo(0, 3);
        ctx.lineTo(-1.2, 4);
        ctx.lineTo(-1, 0.8);
        ctx.lineTo(-3.6, 1.6);
        ctx.lineTo(-3.6, 0.5);
        ctx.lineTo(-1, -2);
      } else if (type === 'bizjet') {
        // Small, sleek: pointed nose, short straight-ish wings set well aft, narrow tail.
        ctx.moveTo(0, -5.5);
        ctx.lineTo(0.7, -1.5);
        ctx.lineTo(3, 1);
        ctx.lineTo(3, 1.9);
        ctx.lineTo(0.7, 1.1);
        ctx.lineTo(0.9, 4.2);
        ctx.lineTo(0, 3.2);
        ctx.lineTo(-0.9, 4.2);
        ctx.lineTo(-0.7, 1.1);
        ctx.lineTo(-3, 1.9);
        ctx.lineTo(-3, 1);
        ctx.lineTo(-0.7, -1.5);
      } else if (type === 'turboprop') {
        // Straight (unswept) wings with a small nacelle bump, boxier/stubbier fuselage.
        ctx.moveTo(0, -5);
        ctx.lineTo(0.9, -1);
        ctx.lineTo(4.5, -1);
        ctx.lineTo(4.5, 0.4);
        ctx.lineTo(1.6, 0.6);
        ctx.lineTo(1.4, 1.2);
        ctx.lineTo(2.2, 1.2);
        ctx.lineTo(1, 3.8);
        ctx.lineTo(0, 3);
        ctx.lineTo(-1, 3.8);
        ctx.lineTo(-2.2, 1.2);
        ctx.lineTo(-1.4, 1.2);
        ctx.lineTo(-1.6, 0.6);
        ctx.lineTo(-4.5, 0.4);
        ctx.lineTo(-4.5, -1);
        ctx.lineTo(-0.9, -1);
      } else if (type === 'singleprop') {
        // Small GA single: single wide straight wing, small tail, short blunt nose.
        ctx.moveTo(0, -4);
        ctx.lineTo(0.7, -1.2);
        ctx.lineTo(4.2, 0.2);
        ctx.lineTo(4.2, 1);
        ctx.lineTo(0.7, 0.2);
        ctx.lineTo(0.8, 3.6);
        ctx.lineTo(0, 2.8);
        ctx.lineTo(-0.8, 3.6);
        ctx.lineTo(-0.7, 0.2);
        ctx.lineTo(-4.2, 1);
        ctx.lineTo(-4.2, 0.2);
        ctx.lineTo(-0.7, -1.2);
      } else if (type === 'glider') {
        // Very long, thin, unswept wings and a slender fuselage - no engine bulk anywhere.
        ctx.moveTo(0, -4.5);
        ctx.lineTo(0.5, -0.5);
        ctx.lineTo(6, 0.3);
        ctx.lineTo(6, 0.8);
        ctx.lineTo(0.5, 0.6);
        ctx.lineTo(0.6, 4);
        ctx.lineTo(0, 3.2);
        ctx.lineTo(-0.6, 4);
        ctx.lineTo(-0.5, 0.6);
        ctx.lineTo(-6, 0.8);
        ctx.lineTo(-6, 0.3);
        ctx.lineTo(-0.5, -0.5);
      } else {
        // Default narrowbody jet (737/A320-family shape).
        ctx.moveTo(0, -6);
        ctx.lineTo(1.2, -2.5);
        ctx.lineTo(5, 0.5);
        ctx.lineTo(5, 2);
        ctx.lineTo(1.2, 1);
        ctx.lineTo(1.5, 5);
        ctx.lineTo(0, 3.5);
        ctx.lineTo(-1.5, 5);
        ctx.lineTo(-1.2, 1);
        ctx.lineTo(-5, 2);
        ctx.lineTo(-5, 0.5);
        ctx.lineTo(-1.2, -2.5);
      }
      ctx.closePath();
    }

    let sweepAngle = 0;

    function drawRadarScope() {
      if (!ctx || !canvas || !map) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      processAutoScroll();

      const centerPt = map.latLngToContainerPoint([userConfig.lat, userConfig.lon]);

      const edgeLat = userConfig.lat + (userConfig.radiusNM / 60);
      const edgePt = map.latLngToContainerPoint([edgeLat, userConfig.lon]);
      const maxRadiusPx = Math.abs(edgePt.y - centerPt.y);

      ctx.shadowColor = '#00ff66';
      ctx.shadowBlur = 8;

      ctx.strokeStyle = 'rgba(0, 255, 102, 0.35)';
      ctx.lineWidth = 1;
      [0.25, 0.5, 0.75, 1.0].forEach((factor) => {
        const r = maxRadiusPx * factor;
        ctx.beginPath();
        ctx.arc(centerPt.x, centerPt.y, r, 0, 2 * Math.PI);
        ctx.stroke();

        ctx.fillStyle = 'rgba(0, 255, 102, 0.8)';
        ctx.font = '9px system-ui';
        ctx.fillText(`${(userConfig.radiusNM * factor).toFixed(0)} NM`, centerPt.x + 4, centerPt.y - r + 10);
      });

      ctx.beginPath();
      ctx.moveTo(centerPt.x - maxRadiusPx, centerPt.y);
      ctx.lineTo(centerPt.x + maxRadiusPx, centerPt.y);
      ctx.moveTo(centerPt.x, centerPt.y - maxRadiusPx);
      ctx.lineTo(centerPt.x, centerPt.y + maxRadiusPx);
      ctx.strokeStyle = 'rgba(0, 255, 102, 0.25)';
      ctx.stroke();

      ctx.fillStyle = '#00ff66';
      ctx.font = 'bold 11px system-ui';
      ctx.fillText('N', centerPt.x - 4, centerPt.y - maxRadiusPx - 5);
      ctx.fillText('S', centerPt.x - 4, centerPt.y + maxRadiusPx + 15);
      ctx.fillText('E', centerPt.x + maxRadiusPx + 5, centerPt.y + 4);
      ctx.fillText('W', centerPt.x - maxRadiusPx - 18, centerPt.y + 4);

      sweepAngle += 0.015;
      for (let i = 0; i < 15; i++) {
        const trailAngle = sweepAngle - (i * 0.012);
        const trailX = centerPt.x + Math.cos(trailAngle) * maxRadiusPx;
        const trailY = centerPt.y + Math.sin(trailAngle) * maxRadiusPx;
        
        ctx.beginPath();
        ctx.moveTo(centerPt.x, centerPt.y);
        ctx.lineTo(trailX, trailY);
        ctx.strokeStyle = `rgba(0, 255, 102, ${0.12 * (1 - i / 15)})`;
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      const sweepX = centerPt.x + Math.cos(sweepAngle) * maxRadiusPx;
      const sweepY = centerPt.y + Math.sin(sweepAngle) * maxRadiusPx;
      ctx.beginPath();
      ctx.moveTo(centerPt.x, centerPt.y);
      ctx.lineTo(sweepX, sweepY);
      ctx.strokeStyle = 'rgba(0, 255, 102, 0.9)';
      ctx.lineWidth = 2;
      ctx.stroke();

      Object.keys(aircraftTrails).forEach(hex => {
        const trail = aircraftTrails[hex];
        if (trail.length > 1) {
          ctx.beginPath();
          for (let i = 0; i < trail.length; i++) {
            const p = map.latLngToContainerPoint([trail[i].lat, trail[i].lon]);
            if (i === 0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
          }
          ctx.strokeStyle = 'rgba(0, 191, 255, 0.3)';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      });

      if (liveAircraft && liveAircraft.length > 0) {
        liveAircraft.forEach(ac => {
          if (!ac.lat || !ac.lon) return;
          
          const pt = map.latLngToContainerPoint([ac.lat, ac.lon]);
          const isMil = isMilitary(ac);
          const isEmg = ac.squawk === '7500' || ac.squawk === '7600' || ac.squawk === '7700';
          const isLocked = lockedAircraft && lockedAircraft.hex === ac.hex;

          if (isLocked) {
            const pulseRadius = 12 + Math.sin(Date.now() / 150) * 3;
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, pulseRadius, 0, 2 * Math.PI);
            ctx.strokeStyle = '#ff3333';
            ctx.lineWidth = 2;
            ctx.shadowColor = '#ff3333';
            ctx.shadowBlur = 10;
            ctx.stroke();
            ctx.shadowColor = '#00ff66';
            ctx.shadowBlur = 8;
          }

          if (ac.track !== undefined) {
            const trackRad = (ac.track - 90) * (Math.PI / 180);
            const lineLen = 16;
            const endX = pt.x + Math.cos(trackRad) * lineLen;
            const endY = pt.y + Math.sin(trackRad) * lineLen;
            ctx.beginPath();
            ctx.moveTo(pt.x, pt.y);
            ctx.lineTo(endX, endY);
            ctx.strokeStyle = isMil ? '#ffb000' : '#00bfff';
            ctx.lineWidth = 1.2;
            ctx.stroke();
          }

          ctx.save();
          ctx.translate(pt.x, pt.y);
          const heading = ac.track !== undefined ? ac.track : 0;
          ctx.rotate((heading * Math.PI) / 180);

          const silhouetteType = getSilhouetteType(ac.t, ac.category);
          drawAircraftSilhouettePath(ctx, silhouetteType);

          ctx.fillStyle = isEmg ? '#ff3333' : (isMil ? '#ffb000' : '#00ff66');
          ctx.fill();
          ctx.lineWidth = 0.8;
          ctx.strokeStyle = '#020704';
          ctx.stroke();
          ctx.restore();

          ctx.fillStyle = isMil ? '#ffb000' : '#00ff66';
          ctx.font = 'bold 9px system-ui';
          const label = ac.flight ? ac.flight.trim() : ac.hex;
          const altText = ac.alt_baro ? ` FL${Math.round(ac.alt_baro / 100)}` : '';
          ctx.fillText(`${label}${altText}`, pt.x + 8, pt.y + 3);
        });
      }

      requestAnimationFrame(drawRadarScope);
    }

    document.getElementById('start-overlay').addEventListener('click', startFeed);
    document.getElementById('start-overlay').addEventListener('touchstart', startFeed);
  </script>
</body>
</html>
